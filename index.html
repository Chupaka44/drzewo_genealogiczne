/* ============ statistics ============ */
function computeProblems(){const out=[];const add=(sev,id,t)=>out.push({sev,id,t});
  const seen=new Map();
  for(const p of C.people.values()){const b=dateNum(p.birthDate),d=dateNum(p.deathDate);const a=ageOf(p);
    if(!p.firstName&&!p.lastName)add('warn',p.id,'Osoba bez imienia i nazwiska');
    if(b&&d&&d<b)add('err',p.id,'Data śmierci przed datą urodzenia');
    if(!p.deceased&&a!=null&&a>110)add('warn',p.id,`Oznaczona jako żyjąca, ale miałaby ${lat(a)}`);
    if(parseDate(p.birthDate)&&parseDate(p.birthDate).invalid)add('warn',p.id,'Nierozpoznana data urodzenia: '+p.birthDate);
    if(parseDate(p.deathDate)&&parseDate(p.deathDate).invalid)add('warn',p.id,'Nierozpoznana data śmierci: '+p.deathDate);
    for(const par of parentsOf(p)){const q=P(par);const ag=ageAt(q,p.birthDate);
      if(ag!=null&&ag<13)add('err',p.id,`${G(q,'Ojciec','Matka','Rodzic')} miał${G(q,'','a','(a)')} ${lat(ag)} przy narodzinach dziecka`);
      if(ag!=null&&q.gender==='K'&&ag>55)add('warn',p.id,`Matka miała ${lat(ag)} przy narodzinach`);
      if(ag!=null&&q.gender==='M'&&ag>80)add('warn',p.id,`Ojciec miał ${lat(ag)} przy narodzinach`);
      const qd=dateNum(q.deathDate);if(q.deceased&&qd&&b&&b>qd+(q.gender==='M'?10000:0))add('err',p.id,`Urodzon${G(p,'y','a','y/a')} po śmierci ${G(q,'ojca','matki','rodzica')}`);}
    const k=norm(nameOf(p))+'|'+(yearOf(p.birthDate)||'');if(nameOf(p)!=='Bez imienia'&&yearOf(p.birthDate)){if(seen.has(k))add('warn',p.id,'Możliwy duplikat: '+nameOf(P(seen.get(k)))+' ('+yearOf(p.birthDate)+')');else seen.set(k,p.id);}}
  for(const u of C.unions.values()){const A=P(u.a),B=P(u.b);if(!A||!B)continue;for(const x of [A,B]){const ag=ageAt(x,u.date);if(ag!=null&&ag<15)add('warn',x.id,`Ślub w wieku ${lat(ag)}`);}}
  return out;}
function upcoming(days=60){const now=new Date();now.setHours(0,0,0,0);const out=[];
  const add=(ds,mk)=>{const p=parseDate(ds);if(!p||p.invalid||!p.m||!p.d||p.q)return;let nx=new Date(now.getFullYear(),p.m-1,p.d);if(nx<now)nx=new Date(now.getFullYear()+1,p.m-1,p.d);
    const diff=Math.round((nx-now)/864e5);if(diff>days)return;const y=nx.getFullYear()-p.y;if(y<=0)return;out.push(Object.assign({diff,nx,y},mk(y)));};
  for(const p of C.people.values()){if(!p.deceased)add(p.birthDate,y=>({id:p.id,t:nameOf(p),s:`urodziny · kończy ${lat(y)}`}));
    else{add(p.birthDate,y=>({id:p.id,t:nameOf(p),s:`${y}. rocznica urodzin`}));add(p.deathDate,y=>({id:p.id,t:nameOf(p),s:`${y}. rocznica śmierci`}));}}
  for(const u of C.unions.values()){const A=P(u.a),B=P(u.b);if(!A||!B||u.status==='rozwod')continue;add(u.date,y=>({id:A.id,t:`${givenOf(A)||nameOf(A)} i ${givenOf(B)||nameOf(B)}`,s:`${y}. rocznica ${u.status==='partnerzy'?'związku':'ślubu'}`}));}
  return out.sort((a,b)=>a.diff-b.diff);}
function bars(entries,max=8){const top=entries.slice(0,max);const m=Math.max(1,...top.map(e=>e[1]));
  return top.length?`<div class="bars">${top.map(([k,n])=>`<div class="bar"><span class="t" title="${esc(k)}">${esc(k)}</span><span class="track"><span class="fill" style="width:${(n/m*100).toFixed(1)}%;display:block"></span></span><span class="n">${n}</span></div>`).join('')}</div>`:'<p class="muted" style="margin:0">Brak danych.</p>';}
function countBy(arr){const m=new Map();for(const x of arr)if(x)m.set(x,(m.get(x)||0)+1);return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'pl'));}
function renderStats(){const el=$('#v-statystyki');const ppl=[...C.people.values()];
  if(!ppl.length){el.innerHTML=`<div class="view-inner"><h1 style="font-size:26px">Statystyki rodu</h1><p class="muted">Dodaj osoby, a tutaj pojawią się liczby, rocznice i podpowiedzi o brakujących danych.</p></div>`;return;}
  const depth=new Map();const gd=(id,st)=>{if(depth.has(id))return depth.get(id);if(st.has(id))return 1;st.add(id);let d=1;for(const par of parentsOf(P(id)))d=Math.max(d,1+gd(par,st));st.delete(id);depth.set(id,d);return d;};
  let gens=0;for(const p of ppl)gens=Math.max(gens,gd(p.id,new Set()));

  const avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):null;

  const years=ppl.map(p=>yearOf(p.birthDate)).filter(Boolean);const earliest=years.length?Math.min(...years):null;
  const dec=countBy(years.map(y=>String(Math.floor(y/10)*10))).sort((a,b)=>+a[0]-+b[0]);
  const up=upcoming(60),probs=computeProblems();
  const fmtIn=d=>d===0?'dziś':d===1?'jutro':`za ${d} ${plural(d,'dzień','dni','dni')}`;
  let chart='';if(dec.length){const w=Math.max(320,dec.length*44),h=170,m=Math.max(...dec.map(d=>d[1])),bw=Math.min(30,(w-20)/dec.length-8);
    const ticks=[...new Set([0,Math.ceil(m/2),m])];
    chart=`<div class="chart" style="overflow-x:auto"><svg viewBox="0 0 ${w} ${h}" style="min-width:${Math.min(w,600)}px" role="img" aria-label="Liczba urodzeń w kolejnych dekadach">${ticks.map(t=>{const y=h-26-(t/m)*(h-46);return `<line class="g" x1="24" x2="${w}" y1="${y}" y2="${y}"/><text x="18" y="${y+4}" text-anchor="end">${t}</text>`;}).join('')}
    ${dec.map((d,i)=>{const x=30+i*((w-36)/dec.length)+((w-36)/dec.length-bw)/2,bh=(d[1]/m)*(h-46);return `<rect class="b" x="${x}" y="${h-26-bh}" width="${bw}" height="${bh}" rx="3"><title>${d[0]}–${+d[0]+9}: ${d[1]}</title></rect><text x="${x+bw/2}" y="${h-10}" text-anchor="middle">${d[0]}</text>`;}).join('')}</svg></div>`;}
  const item=(id,d,t,s)=>`<li><button data-sel="${id}"><span class="d">${d}</span><span>${t}</span><span class="s">${s}</span></button></li>`;
  el.innerHTML=`<div class="view-inner"><div><h1 style="font-size:26px">Statystyki rodu</h1><p class="muted" style="margin:.3em 0 0">${esc(meta().name||'')}${earliest?` · zapis sięga ${earliest} roku`:''}</p></div>
  <div class="tiles"><div class="tile"><div class="v">${ppl.length}</div><div class="l">${plural(ppl.length,'osoba','osoby','osób')} w drzewie</div></div>
  <div class="tile"><div class="v">${gens}</div><div class="l">${plural(gens,'pokolenie','pokolenia','pokoleń')}</div></div>

  <div class="tile"><div class="v">${C.unions.size}</div><div class="l">zapisanych związków</div></div>
  <div class="tile"><div class="v">${avgAll!=null?avgAll:'—'}</div><div class="l">średnia długość życia${avgM!=null||avgK!=null?` (M ${avgM??'—'}, K ${avgK??'—'})`:''}</div></div>
  <div class="tile"><div class="v">${countBy(ppl.map(p=>p.maidenName||p.lastName)).length}</div><div class="l">nazwisk rodowych</div></div></div>
  <div class="cols">
   <div class="panel-box"><h2>Najbliższe rocznice</h2><p class="muted" style="margin:0;font-size:13px">Następne 60 dni: urodziny, rocznice ślubów i śmierci.</p>${up.length?`<ul class="items">${up.slice(0,12).map(u=>item(u.id,`${u.nx.getDate()} ${MS[u.nx.getMonth()]}`,esc(u.t),esc(u.s)+' · '+fmtIn(u.diff))).join('')}</ul>`:'<p class="muted" style="margin:0">Brak rocznic z pełną datą w tym okresie.</p>'}</div>
   <div class="panel-box"><h2>Do sprawdzenia</h2><p class="muted" style="margin:0;font-size:13px">Niespójne daty i możliwe duplikaty.</p>${probs.length?`<ul class="items">${probs.slice(0,15).map(x=>item(x.id,`<span class="sev ${x.sev}">${x.sev==='err'?'błąd':'uwaga'}</span>`,esc(nameOf(P(x.id))),esc(x.t))).join('')}</ul>${probs.length>15?`<p class="muted" style="margin:0">…i ${probs.length-15} więcej.</p>`:''}`:'<p style="margin:0;color:var(--ok)">Nie znaleziono problemów z danymi.</p>'}</div>
  </div>
  <div class="cols">
   <div class="panel-box"><h2>Rekordy</h2><ul class="items">${oldest?item(oldest[0].id,lat(oldest[1]),esc(nameOf(oldest[0])),'najstarsza żyjąca osoba'):''}${longest?item(longest[0].id,lat(longest[1]),esc(nameOf(longest[0])),'najdłużej żyjący przodek'):''}${(()=>{const k=ppl.map(p=>[p,kidsOf(p.id).length]).sort((a,b)=>b[1]-a[1])[0];return k&&k[1]?item(k[0].id,k[1]+' '+plural(k[1],'dziecko','dzieci','dzieci'),esc(nameOf(k[0])),'najwięcej dzieci'):'';})()}${(()=>{const e=ppl.filter(p=>yearOf(p.birthDate)).sort(byBirth)[0];return e?item(e.id,String(yearOf(e.birthDate)),esc(nameOf(e)),'najwcześniej urodzona osoba'):'';})()}</ul></div>
   <div class="panel-box"><h2>Urodzenia w dekadach</h2>${chart||'<p class="muted" style="margin:0">Brak dat urodzenia.</p>'}</div>
  </div>
  <div class="cols">
   <div class="panel-box"><h2>Nazwiska rodowe</h2>${bars(countBy(ppl.map(p=>p.maidenName||p.lastName)))}</div>
   <div class="panel-box"><h2>Najczęstsze imiona</h2>${bars(countBy(ppl.map(p=>p.firstName)))}</div>
   <div class="panel-box"><h2>Miejsca urodzenia</h2>${bars(countBy(ppl.map(p=>p.birthPlace)))}</div>
   <div class="panel-box"><h2>Zawody</h2>${bars(countBy(ppl.map(p=>p.occupation)))}</div>
  </div></div>`;
  el.onclick=e=>{const b=e.target.closest('[data-sel]');if(b)selectPerson(b.dataset.sel);};
}

/* ============ data view ============ */
function renderData(){const el=$('#v-dane');
  if(!el.dataset.built){el.dataset.built=1;
    el.innerHTML=`<div class="view-inner"><div><h1 style="font-size:26px">Dane i eksport</h1><p class="muted" style="margin:.3em 0 0" id="d-where"></p></div>
    <div class="cards">
     <div class="dcard"><h2>Uprawnienia</h2><p id="d-role"></p></div>
     <div class="dcard"><h2>Wygląd</h2><p>Tryb strony zapamiętywany na tym urządzeniu.</p>
      <div class="radios"><label><input type="radio" name="themeMode" value="light"> Jasny</label><label><input type="radio" name="themeMode" value="dark"> Ciemny</label><label><input type="radio" name="themeMode" value="system"> Jak w systemie</label></div></div>
     <div class="dcard" data-edit><h2>Płeć z imion</h2><p id="d-gtxt"></p><div class="row"><button class="btn" id="d-gbtn">Uzupełnij płeć</button></div></div>
     <div class="dcard" data-edit><h2>Nazwa drzewa</h2><div class="row"><input type="text" id="d-name" aria-label="Nazwa drzewa" style="flex:1 1 180px"><button class="btn primary" id="d-nameSave">Zapisz</button></div></div>
     <div class="dcard"><h2>Kopia zapasowa</h2><p>Pełny zapis drzewa razem ze zdjęciami, w formacie JSON. Wczytasz go tutaj w każdej chwili.</p><div class="row"><button class="btn" id="d-json">Pobierz kopię (JSON)</button></div></div>
     <div class="dcard"><h2>GEDCOM</h2><p>Standard wymiany drzew genealogicznych (MyHeritage, Ancestry, FamilySearch, Gramps). Plik zapisze się z końcówką .ged.txt. Usuń „.txt”, zanim wczytasz go do innego programu.</p><div class="row"><button class="btn" id="d-ged">Pobierz GEDCOM</button><button class="btn ghost" id="d-gedCopy">Kopiuj do schowka</button></div></div>
     <div class="dcard"><h2>Tabela i obraz</h2><p>Lista osób dla arkusza kalkulacyjnego oraz obraz aktualnego widoku drzewa.</p><div class="row"><button class="btn" id="d-csv">CSV</button><button class="btn" id="d-svg">Drzewo SVG</button><button class="btn" id="d-png">Drzewo PNG</button></div></div>
     <div class="dcard" data-edit><h2>Import</h2><p>Wczytaj kopię JSON z Kroniki albo plik GEDCOM (.ged) z innego programu.</p>
      <div class="radios"><label><input type="radio" name="impMode" value="merge" checked> Dodaj do obecnego drzewa</label><label><input type="radio" name="impMode" value="replace"> Zastąp całe drzewo</label></div>
      <div class="row"><label class="btn primary" for="impFile">Wybierz plik…</label><input type="file" id="impFile" accept=".json,.ged,.txt,.gedcom,application/json,text/plain" hidden></div><p class="hint" id="impMsg"></p></div>
     <div class="dcard" data-edit><h2>Wyczyść drzewo</h2><p>Usuwa wszystkie osoby i związki. Najpierw pobierz kopię zapasową.</p><div id="d-clearBox" class="row"><button class="btn danger" id="d-clear">Usuń wszystkie dane…</button></div></div>
    </div>
    <div class="dcard"><h2>Skróty klawiszowe</h2><p style="color:var(--ink)"><span class="mono">/</span> szukaj · <span class="mono">N</span> nowa osoba · <span class="mono">Ctrl+Z</span> cofnij · <span class="mono">+ / −</span> powiększenie · <span class="mono">0</span> dopasuj drzewo · <span class="mono">Esc</span> zamknij okno. Dwuklik na osobie w drzewie ustawia ją w środku.</p></div></div>`;
    $('#d-nameSave').onclick=()=>{const n=$('#d-name').value.trim()||'Moja rodzina';commit([{col:'meta',obj:{...meta(),id:'tree',name:n}}],'zmiana nazwy').then(()=>toast('Zapisano nazwę drzewa.'));};
    $('#d-json').onclick=()=>{const data={app:'kronika-rodu',version:1,exported:new Date().toISOString(),meta:meta(),people:[...C.people.values()],unions:[...C.unions.values()]};
      saveFile(fileBase()+'-kopia.json',JSON.stringify(data,null,1),'application/json');};
    $('#d-ged').onclick=()=>saveFile(fileBase()+'.ged.txt',exportGedcom(),'text/plain');
    $('#d-gedCopy').onclick=async()=>{try{await navigator.clipboard.writeText(exportGedcom());toast('Skopiowano GEDCOM do schowka.');}catch(e){toast('Schowek jest niedostępny. Użyj „Pobierz GEDCOM”.','err');}};
    $('#d-csv').onclick=exportCsv;$('#d-svg').onclick=()=>{location.hash='drzewo';setTimeout(()=>exportTree('svg'),80);};$('#d-png').onclick=()=>{location.hash='drzewo';setTimeout(()=>exportTree('png'),80);};
    $$('input[name=themeMode]').forEach(r=>r.onchange=e=>applyTheme(e.target.value,true));
    $('#d-gbtn').onclick=()=>{const ch=[];for(const p of C.people.values()){if(p.gender!=='N'&&p.gender)continue;const g=guessGender(p.firstName,p.lastName);if(g)ch.push({col:'people',obj:{...clone(p),gender:g}});}
      if(!ch.length){toast('Nie ma osób, którym da się przypisać płeć po imieniu.');return;}
      commit(ch,'uzupełnienie płci').then(()=>{toast(`Przypisano płeć ${ch.length} ${plural(ch.length,'osobie','osobom','osobom')}.`,null,{label:'Cofnij',fn:undo});renderData();});};
    $('#impFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importFile(f);};
    $('#d-clear').onclick=()=>{$('#d-clearBox').innerHTML=`<div class="confirm"><p>Wpisz <b>USUŃ</b>, aby skasować ${C.people.size} ${plural(C.people.size,'osobę','osoby','osób')} i ${C.unions.size} ${plural(C.unions.size,'związek','związki','związków')}.</p><input type="text" id="d-clearTxt" aria-label="Potwierdzenie"><div class="row"><button class="btn danger solid" id="d-clearYes">Usuń wszystko</button><button class="btn" id="d-clearNo">Anuluj</button></div></div>`;
      $('#d-clearNo').onclick=()=>{el.dataset.built='';renderData();};
      $('#d-clearYes').onclick=async()=>{if($('#d-clearTxt').value.trim().toUpperCase()!=='USUŃ'){toast('Wpisz słowo USUŃ, aby potwierdzić.','err');return;}
        const ch=[...[...C.people.keys()].map(id=>({col:'people',del:id})),...[...C.unions.keys()].map(id=>({col:'unions',del:id}))];closePanel();S.focusId=null;
        el.dataset.built='';await commit(ch,'wyczyszczenie drzewa');renderData();toast('Drzewo zostało wyczyszczone.',null,{label:'Cofnij',fn:undo});};};}
  $('#d-name').value=meta().name||'';updateThemeUi();
  const unk=[...C.people.values()].filter(p=>!p.gender||p.gender==='N'),guess=unk.filter(p=>guessGender(p.firstName,p.lastName));
  $('#d-gtxt').textContent=unk.length?`${unk.length} ${plural(unk.length,'osoba nie ma','osoby nie mają','osób nie ma')} ustawionej płci. Po imieniu (lub nazwisku na -ski/-ska) da się rozpoznać ${guess.length}.`:'Wszystkie osoby mają ustawioną płeć. Nowe osoby dostają ją automatycznie po wpisaniu imienia.';
  $('#d-gbtn').disabled=!guess.length;$('#d-gbtn').textContent=guess.length?`Uzupełnij płeć (${guess.length})`:'Uzupełnij płeć';
  $('#d-role').innerHTML=S.mode==='local'?'Ten plik działa bez kont: każdy, kto go otworzy na tym urządzeniu, może edytować. Przycisk „Administrator” w nagłówku przełącza na widok gościa (tylko podgląd).':
    S.role==='admin'?'Jesteś <b>administratorem</b>: możesz dodawać, edytować i usuwać osoby. Udostępnij stronę rodzinie przez menu <b>Udostępnij</b>. Osoby z rolą <b>Edytor</b> też będą administratorami. Każda inna rola (Współtwórca, Komentujący, Przeglądający) daje tylko podgląd.':
    'Masz <b>tylko podgląd</b>: możesz oglądać drzewo, szukać osób, liczyć pokrewieństwo i pobierać eksporty. Zmiany wprowadza administrator.';
  $('#d-where').textContent=S.mode==='local'?'Dane są zapisane w tej przeglądarce, na tym urządzeniu. Regularnie pobieraj kopię zapasową JSON.':
    S.readonly?'Oglądasz to drzewo w trybie tylko do odczytu.':'Zmiany zapisują się automatycznie. Osoby, którym udostępnisz stronę z prawem edycji, też mogą dopisywać krewnych.';}
function fileBase(){return norm(meta().name||'drzewo').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'drzewo';}
async function importFile(f){const msg=$('#impMsg');msg.className='hint';msg.textContent='Wczytywanie…';
  let text;try{text=await f.text();}catch(e){msg.textContent='Nie udało się odczytać pliku.';msg.className='hint bad';return;}
  let people=[],unions=[],newMeta=null;
  try{if(text.trim().startsWith('{')){const d=JSON.parse(text);if(!Array.isArray(d.people))throw new Error('format');
      people=d.people.filter(p=>p&&p.id).map(p=>({...cleanPerson(p),id:String(p.id).replace(/[^A-Za-z0-9_\-.~:@+]/g,'').slice(0,60)||uid('p')}));
      unions=(d.unions||[]).filter(u=>u&&u.a&&u.b).map(u=>({...cleanUnion(u),id:String(u.id||uid('u')).replace(/[^A-Za-z0-9_\-.~:@+]/g,'').slice(0,60)||uid('u')}));
      if(d.meta&&d.meta.name)newMeta={id:'tree',name:String(d.meta.name).slice(0,120)};}
    else if(/^\s*0\s+HEAD/m.test(text)){const r=parseGedcom(text);people=r.people.map(x=>{if(x.gender==='N'){const g=guessGender(x.firstName,x.lastName);if(g)x.gender=g;}return cleanPerson(x);});unions=r.unions.map(cleanUnion);}
    else throw new Error('format');}
  catch(e){msg.textContent='Ten plik nie wygląda na kopię Kroniki (JSON) ani na GEDCOM.';msg.className='hint bad';return;}
  if(!people.length){msg.textContent='W pliku nie znaleziono żadnych osób.';msg.className='hint bad';return;}
  const replace=document.querySelector('input[name=impMode]:checked').value==='replace';
  const ch=[];if(replace){for(const id of C.people.keys())ch.push({col:'people',del:id});for(const id of C.unions.keys())ch.push({col:'unions',del:id});closePanel();S.focusId=null;}
  for(const p of people)ch.push({col:'people',obj:p});for(const u of unions)ch.push({col:'unions',obj:u});
  if(newMeta&&(replace||!C.people.size))ch.push({col:'meta',obj:newMeta});
  msg.textContent=`Zapisywanie ${people.length} ${plural(people.length,'osoby','osób','osób')}…`;
  const ok=await commit(ch,'import pliku');
  msg.textContent=ok?`Wczytano ${people.length} ${plural(people.length,'osobę','osoby','osób')} i ${unions.length} ${plural(unions.length,'związek','związki','związków')}.`:'Import zakończony z błędami. Część danych mogła się nie zapisać.';
  msg.className=ok?'hint':'hint bad';if(ok){S.focusId=null;firstFit=true;toast('Import zakończony.',null,{label:'Pokaż drzewo',fn:()=>{location.hash='drzewo';}});}}

/* ============ header search & global ============ */
function wireGlobal(){
  const q=$('#q'),res=$('#qres');let hi=0;
  const show=()=>{const v=q.value.trim();if(!v){res.hidden=true;return;}const r=searchPeople(v).slice(0,10);hi=0;
    res.innerHTML=r.length?r.map((p,i)=>`<button class="pick-item${i===0?' on':''}" data-id="${p.id}">${esc(nameOf(p))}<span>${esc(lifeSpan(p))}</span></button>`).join(''):'<div class="pick-empty">Nikogo nie znaleziono</div>';res.hidden=false;};
  const go=id=>{q.value='';res.hidden=true;q.blur();if(S.view!=='drzewo')location.hash='drzewo';setTimeout(()=>{S.focusId=id;savePrefs();renderTree();selectPerson(id);centerOn(id,true);},30);};
  q.addEventListener('input',show);q.addEventListener('focus',show);
  q.addEventListener('keydown',e=>{const items=$$('.pick-item',res);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;hi=(hi+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((b,i)=>b.classList.toggle('on',i===hi));}
    else if(e.key==='Enter'){e.preventDefault();if(items[hi])go(items[hi].dataset.id);}else if(e.key==='Escape'){q.value='';res.hidden=true;q.blur();}});
  res.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-id]');if(b){e.preventDefault();go(b.dataset.id);}});
  q.addEventListener('blur',()=>setTimeout(()=>{res.hidden=true;},150));
  $('#addBtn').onclick=()=>openPersonForm(null);$('#undoBtn').onclick=undo;
  $('#themeBtn').onclick=()=>applyTheme(effectiveTheme()==='dark'?'light':'dark',true);
  $('#roleBtn').onclick=()=>{if(S.role!=='admin')return;S.preview=!S.preview;applyRole();toast(S.preview?'Widok gościa: tak drzewo widzą osoby bez uprawnień.':'Wróciłeś do edycji.');};
  $('#treeName').onclick=()=>{if(!S.readonly){location.hash='dane';setTimeout(()=>{const n=$('#d-name');n&&n.focus();n&&n.select();},60);}};
  $('#clearExample').onclick=async()=>{const ch=[];for(const p of C.people.values())if(p.example)ch.push({col:'people',del:p.id});for(const u of C.unions.values())if(u.example)ch.push({col:'unions',del:u.id});
    if(meta().example||!C.meta.has('tree'))ch.push({col:'meta',obj:{id:'tree',name:'Moja rodzina'}});
    closePanel();S.focusId=null;firstFit=true;await commit(ch,'usunięcie przykładu');toast('Przykład usunięty. Dodaj pierwszą osobę.',null,{label:'Cofnij',fn:()=>{undo();}});
    location.hash='drzewo';openPersonForm(null);};
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(!$('#modal').hidden)return closeModal();if(!$('#panel').hidden)return closePanel();}
    const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing&&$('#modal').hidden){e.preventDefault();undo();return;}
    if(typing||e.ctrlKey||e.metaKey||e.altKey||!$('#modal').hidden)return;
    if(e.key==='/'){e.preventDefault();q.focus();}
    else if(e.key.toLowerCase()==='n'&&!S.readonly){e.preventDefault();openPersonForm(null);}
    else if(S.view==='drzewo'&&(e.key==='+'||e.key==='=')){zoomBy(1.2);}
    else if(S.view==='drzewo'&&e.key==='-'){zoomBy(1/1.2);}
    else if(S.view==='drzewo'&&e.key==='0'){fitAll();}
  });
  window.addEventListener('hashchange',route);
}

/* ============ boot ============ */
(function boot(){
  const st=document.createElement('style');st.textContent=TREE_CSS;document.head.appendChild(st);
  loadPrefs();wireTree();wirePanel();wireGlobal();updateThemeUi();renderRole();route();scheduleRender();initStore();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(S.view==='drzewo')renderTree();});
})();
</script>
</body></html>
