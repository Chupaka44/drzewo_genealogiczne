<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Kronika Rodu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: archive desk. A header strip over one working surface (tree canvas, register table, statistics);
   the person's record card slides in from the right like an index card pulled from a drawer. */
:root{
  --bg:#ECEFEA; --surface:#FAFBF8; --surface-2:#E1E7E0; --ink:#1B2528; --muted:#58676A; --line:#C3CCC4;
  --accent:#27477A; --accent-soft:#D9E2F0; --accent-ink:#FFFFFF; --edge:#7D8C88;
  --male:#DDE6F1; --female:#F2E2E5; --unknown:#E6E7E1;
  --danger:#A03A2C; --ok:#2E6A49; --warn:#8F6310;
  --shadow:0 10px 30px rgba(27,37,40,.14);
  --font-display:'Spectral', Georgia, 'Times New Roman', serif;
  --font-body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12181A; --surface:#1A2225; --surface-2:#232E31; --ink:#E5EBE7; --muted:#95A4A1; --line:#33403E;
  --accent:#93B3E2; --accent-soft:#22324A; --accent-ink:#0E1828; --edge:#6D7E7A;
  --male:#203047; --female:#3B252B; --unknown:#2A302F;
  --danger:#E4806F; --ok:#78C59C; --warn:#E2B65E; --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#12181A; --surface:#1A2225; --surface-2:#232E31; --ink:#E5EBE7; --muted:#95A4A1; --line:#33403E;
  --accent:#93B3E2; --accent-soft:#22324A; --accent-ink:#0E1828; --edge:#6D7E7A;
  --male:#203047; --female:#3B252B; --unknown:#2A302F;
  --danger:#E4806F; --ok:#78C59C; --warn:#E2B65E; --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark; }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 12px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.005em}

/* header */
.top{grid-row:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.eyebrow{font:500 11px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tree-name{background:none;border:0;padding:2px 0;font:600 22px/1.15 var(--font-display);cursor:pointer;text-align:left;max-width:min(52vw,420px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ro .tree-name{cursor:default}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 12px;border-radius:8px;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -2px 0 var(--accent)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.role{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--font-mono);border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.role:hover{border-color:var(--edge)}
.role.view{cursor:default;color:var(--muted)}
.role.preview{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.role svg{flex:none}
.status{font:500 11px var(--font-mono);color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.status.saving i{background:var(--warn)} .status.err i{background:var(--danger)} .status.ro i{background:var(--muted)}
.search{position:relative}
.search input{width:190px;max-width:100%}
@media (max-width:1400px){.status span{display:none}}
@media (max-width:1180px){.role .rl{display:none}}
.results{position:absolute;right:0;top:calc(100% + 4px);width:min(340px,90vw);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:40;max-height:60vh;overflow:auto;padding:4px}

/* controls */
.inp,input[type=text],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{resize:vertical;width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--edge)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.danger.solid{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.small{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;display:inline-grid;place-items:center;font-size:18px;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.ro [data-edit]{display:none!important}

/* banner */
.banner{grid-row:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.banner b{font-weight:600}

/* main */
main{grid-row:3;position:relative;min-height:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.view{position:absolute;inset:0;overflow:auto}
.view.pad{padding:20px clamp(16px,3vw,32px) 40px}
.view-inner{max-width:1100px;margin:0 auto;display:grid;gap:22px}

/* tree */
#v-drzewo{overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.treebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface);font-size:13px;z-index:2}
.treebar .grp{display:flex;align-items:center;gap:4px}
.treebar label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.treebar select{padding:3px 6px}
.treebar .zoom{font:500 12px var(--font-mono);min-width:44px;text-align:center;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.seg button + button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.focus-lbl{color:var(--muted)} .focus-lbl b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:10px;color:var(--muted);font-size:12px;margin-left:auto}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.canvas{position:relative;min-height:0;background:
  radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--line) 70%,transparent) 1px, transparent 0) 0 0/22px 22px, var(--bg);}
#treeSvg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#treeSvg.dragging{cursor:grabbing}
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
.empty .card{max-width:440px;display:grid;gap:12px;justify-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
.empty p{margin:0;color:var(--muted)}
.empty .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* panel */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:20;overflow:auto;padding:18px 18px 28px;display:grid;align-content:start;gap:18px}
.pn-head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start}
.pn-photo{width:72px;height:72px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font:600 24px var(--font-display);color:var(--muted);border:1px solid var(--line)}
.pn-photo img{width:100%;height:100%;object-fit:cover}
.pn-photo.g-M{background:var(--male)} .pn-photo.g-K{background:var(--female)} .pn-photo.g-N{background:var(--unknown)}
.pn-head h2{font-size:22px;line-height:1.15}
.pn-sub{color:var(--muted);font-size:14px;margin-top:2px}
.pn-life{font:500 13px var(--font-mono);color:var(--muted);margin-top:4px}
.pn-actions{display:flex;flex-wrap:wrap;gap:6px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sect{display:grid;gap:8px}
.sect h3{font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px 4px 3px 10px;font-size:14px;max-width:100%}
.chip button.go{background:none;border:0;padding:0;cursor:pointer;text-align:left;display:flex;gap:6px;align-items:baseline;min-width:0}
.chip button.go:hover b{text-decoration:underline}
.chip b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{font:12px var(--font-mono);color:var(--muted);white-space:nowrap}
.chip .x{border:0;background:none;color:var(--muted);cursor:pointer;width:22px;height:22px;border-radius:50%;font-size:14px;line-height:1}
.chip .x:hover{background:var(--surface-2);color:var(--danger)}
.chip.g-M{border-left:3px solid color-mix(in srgb,var(--accent) 60%,var(--male))}
.chip.g-K{border-left:3px solid color-mix(in srgb,var(--danger) 45%,var(--female))}
.chip.tag{padding:3px 10px}
.union{display:grid;gap:4px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.union .meta{font-size:13px;color:var(--muted)}
.union .meta .sym{font-family:var(--font-display);color:var(--accent);font-size:16px}
.add-row{display:flex;flex-wrap:wrap;gap:6px}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:9px}
.timeline li{position:relative;font-size:14px}
.timeline li::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--edge)}
.timeline li.key::before{border-color:var(--accent);background:var(--accent)}
.timeline .when{font:500 12px var(--font-mono);color:var(--muted);display:block}
.note{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:10px;padding:10px 12px;margin:0}
.pn-foot{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.confirm{display:grid;gap:8px;border:1px solid var(--danger);border-radius:10px;padding:10px 12px;width:100%}
.confirm p{margin:0;font-size:14px}

/* modal */
#modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:rgba(10,16,18,.45)}
.dialog{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 8px);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.dialog.wide{width:min(720px,100%)}
.dialog > header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px 20px;border-bottom:1px solid var(--line)}
.dialog > header h2{font-size:20px}
.dlg-body{min-height:0;overflow:auto;padding:16px 20px 20px}
.form{display:grid;gap:14px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.form label > input,.form label > select,.form label > textarea{color:var(--ink);font-size:15px;width:100%}
.form fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin:0;display:grid;gap:10px;min-width:0}
.form legend{font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.check{display:flex!important;flex-direction:row;align-items:center;gap:8px!important;color:var(--ink)!important;font-size:15px!important}
.hint{font-size:12px;color:var(--muted);margin:0}
.hint.bad{color:var(--danger)}
.photo-row{display:flex;gap:14px;align-items:center}
.photo-row .pn-photo{flex:none}
.ev-row{display:grid;grid-template-columns:120px 1fr 1fr auto;gap:6px;align-items:center}
.ctx{background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:14px;margin:0}
.form-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.picker{position:relative}
.picker input{width:100%}
.pick-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:260px;overflow:auto;z-index:70;padding:4px}
.pick-item{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:7px;cursor:pointer}
.pick-item:hover,.pick-item.on{background:var(--surface-2)}
.pick-item span{font:12px var(--font-mono);color:var(--muted);white-space:nowrap}
.pick-empty{padding:10px;color:var(--muted);font-size:14px}

/* list */
.listbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.listbar input[type=search]{flex:1 1 220px}
.count{font:500 12px var(--font-mono);color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:760px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--bg);position:sticky;top:0}
th button{all:unset;cursor:pointer} th button:focus-visible{outline:2px solid var(--accent)}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--bg)}
td .sub{color:var(--muted);font-size:13px}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.gdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;border:1px solid var(--line)}
.gdot.g-M{background:var(--male)} .gdot.g-K{background:var(--female)} .gdot.g-N{background:var(--unknown)}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.tile .v{font:600 30px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.panel-box{display:grid;gap:10px;align-content:start;min-width:0}
.panel-box h2{font-size:19px}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar .n{font:500 12px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.items{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.items li button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:7px 8px;border-radius:8px;width:calc(100% - 16px)}
.items li button:hover{background:var(--bg)}
.items li button:focus-visible{outline:2px solid var(--accent)}
.items .d{font:500 12px var(--font-mono);color:var(--muted);min-width:76px}
.items .s{color:var(--muted);font-size:13px;grid-column:2}
.sev{display:inline-block;font:500 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.sev.err{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.sev.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.muted{color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--font-mono)}
.chart .b{fill:var(--accent)} .chart .g{stroke:var(--line)}

/* kinship */
.kin-pick{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.kin-res{border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;background:var(--bg)}
.kin-res .big{font:500 26px/1.25 var(--font-display);text-wrap:balance}
.kin-res .big em{font-style:normal;color:var(--accent);font-weight:600}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.path .arrow{color:var(--muted);font-family:var(--font-mono);font-size:12px}
.path .chip.lca{border-color:var(--accent);background:var(--accent-soft)}

/* data */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.dcard{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.dcard h2{font-size:18px}
.dcard p{margin:0;color:var(--muted);font-size:14px}
.dcard .row{display:flex;flex-wrap:wrap;gap:8px}
.radios{display:flex;flex-wrap:wrap;gap:12px;font-size:14px}
.radios label{display:flex;gap:6px;align-items:center}

/* toasts */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:80;display:grid;gap:8px;justify-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:14px;pointer-events:auto;display:flex;gap:12px;align-items:center}
.toast.err{background:var(--danger);color:var(--surface)}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 8px;cursor:pointer}

@media (max-width:760px){
  body{padding-bottom:8px}
  .top{gap:8px 12px}
  .tabs{order:3;flex-basis:100%}
  .tools{order:2;flex:1 1 100%;min-width:0;margin-left:0}
  .search{flex:1 1 auto;min-width:0}
  .search input{width:100%}
  .tree-name{font-size:19px;max-width:60vw}
  #panel{top:auto;height:78%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0}
  .legend{display:none}
  .kin-pick{grid-template-columns:1fr}
  .ev-row{grid-template-columns:1fr 1fr auto}
  .ev-row input:nth-child(3){grid-column:1/3}
  .status span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="brand">

          <label for="descDepth">Potomkowie</label>

<script>
'use strict';
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad2=n=>String(n).padStart(2,'0');
const norm=s=>String(s||'').toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[̀-ͯ]/g,'');
function plural(n,one,few,many){const a=Math.abs(n);if(a===1)return one;const d=a%10,h=a%100;return (d>=2&&d<=4&&!(h>=12&&h<=14))?few:many;}
const lat=n=>`${n} ${plural(n,'rok','lata','lat')}`;
const G=(p,m,f,n)=>p&&p.gender==='M'?m:p&&p.gender==='K'?f:(n!==undefined?n:m+'/'+f);
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}};

/* ============ dates ============ */
const MG=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const MN=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const MS=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
function parseDate(s){
  if(s==null) return null; let t=String(s).trim().toLowerCase(); if(!t) return null;
  let q=''; const m0=t.match(/^(około|ok\.?|ca\.?|przed|po)\s*/);
  if(m0){const k=m0[1]; q=k==='przed'?'przed':k==='po'?'po':'ok.'; t=t.slice(m0[0].length);}
  let y,mo=0,d=0,m;
  if((m=t.match(/^(\d{3,4})(?:-(\d{1,2})(?:-(\d{1,2}))?)?$/))){y=+m[1];mo=m[2]?+m[2]:0;d=m[3]?+m[3]:0;}
  else if((m=t.match(/^(\d{1,2})[.\/ ](\d{1,2})[.\/ ](\d{3,4})$/))){d=+m[1];mo=+m[2];y=+m[3];}
  else if((m=t.match(/^(\d{1,2})[.\/](\d{3,4})$/))){mo=+m[1];y=+m[2];}
  else return {invalid:true};
  if(mo>12||d>31||(d&&!mo)) return {invalid:true};
  return {y,m:mo,d,q};
}
function fmtDate(s){const p=parseDate(s);if(!p)return '';if(p.invalid)return String(s);
  const o=p.d&&p.m?`${p.d} ${MG[p.m-1]} ${p.y}`:p.m?`${MN[p.m-1]} ${p.y}`:`${p.y}`;return (p.q?p.q+' ':'')+o;}
const yearOf=s=>{const p=parseDate(s);return p&&!p.invalid?p.y:null;};
const dateNum=s=>{const p=parseDate(s);if(!p||p.invalid)return null;return p.y*10000+(p.m||6)*100+(p.d||15);};
function today(){const n=new Date();return {y:n.getFullYear(),m:n.getMonth()+1,d:n.getDate()};}
function ageBetween(a,b){let g=b.y-a.y;if(a.m&&b.m&&(b.m<a.m||(b.m===a.m&&a.d&&b.d&&b.d<a.d)))g--;return g;}
function ageOf(p){const b=parseDate(p.birthDate);if(!b||b.invalid)return null;
  if(p.deceased){const d=parseDate(p.deathDate);if(!d||d.invalid)return null;return ageBetween(b,d);}
  const a=ageBetween(b,today());return a>=0?a:null;}
function ageAt(p,dateStr){const b=parseDate(p.birthDate),d=parseDate(dateStr);if(!b||b.invalid||!d||d.invalid)return null;return ageBetween(b,d);}

/* ============ names ============ */
const nameOf=p=>{if(!p)return '—';const n=[p.firstName,p.lastName].filter(Boolean).join(' ');return n||'Bez imienia';};
const givenOf=p=>[p.firstName,p.middleName].filter(Boolean).join(' ');
function lifeSpan(p){if(!p)return '';const b=yearOf(p.birthDate),d=yearOf(p.deathDate);
  if(p.deceased){if(b||d)return `${b??'?'} – ${d??'?'}`;return '†';}return b?`ur. ${b}`:'';}
const initials=p=>(((p.firstName||'?')[0])+((p.lastName||'')[0]||'')).toUpperCase();
const NAME_M_A=new Set(['kuba','barnaba','bonawentura','kosma','jarema','zawisza','luca','nikita','ilja','ilya','jona','juda','kostia','misza','grisza','wania','dima','tomasza']);
const NAME_K_X=new Set(['beatrycze','miriam','noemi','naomi','ruth','rut','nel','inez','ines','abigail','karmen','carmen','ester','esther','dagmar','lili','lilly','iris','margit','mercedes','nikol','nicole','agnes','ingrid','doris','gertrud','marie','sophie','julie','charlotte','anne','claire','michelle','zoe','chloe','elle','annie','isabel','rachel','sarah','elisabeth','liv','maud','niki','kiki','mimi','ivy','abbey','jennifer','karen','megan','helen','ellen','susan','sharon','vivien','lilian','gwen','carol','hazel','eden','yasmin','jasmin','lou','rose','grace','alice','olive','kate','amelie','madeleine','sylvie','lucie','beatrix','hedwig','irmgard','margaret']);
const NAME_AMB=new Set(['sasza','andrea','kim','alex','sam','charlie','robin','jean','toni','nikki','dominique','maxime']);
function guessGender(first,last){
  const f=norm(String(first||'').trim().split(/[\s-]+/)[0]);
  if(f.length>=2&&!NAME_AMB.has(f)){
    if(NAME_M_A.has(f))return 'M';if(NAME_K_X.has(f))return 'K';
    if(f.endsWith('a'))return 'K';
    if(!f.endsWith('e'))return 'M';}
  const l=norm(String(last||'').trim());
  if(/(sk|ck|dzk)a$/.test(l))return 'K';if(/(sk|ck|dzk)i$/.test(l))return 'M';
  return null;}
function surnameFor(last,g){if(!last)return '';if(g==='K')return last.replace(/(sk|ck|dzk)i$/i,'$1a');if(g==='M')return last.replace(/(sk|ck|dzk)a$/i,'$1i');return last;}

/* ============ state & storage ============ */
const C={people:new Map(),unions:new Map(),meta:new Map()};
const S={mode:'init',loaded:false,slow:false,readonly:false,canWrite:null,pending:0,writeErr:false,
  view:'drzewo',treeMode:'cale',focusId:null,selectedId:null,ancDepth:3,descDepth:2,showSibs:true};
S.role='admin';S.preview=false;
let db=null;
const meta=()=>C.meta.get('tree')||{id:'tree',name:'Moja rodzina'};
const P=id=>C.people.get(id);
const LOCAL_KEY='kronika-rodu-dane-v1', PREF_KEY='kronika-rodu-widok-v1', THEME_KEY='kronika-rodu-motyw';
let themePref=null;
const effectiveTheme=()=>{const a=document.documentElement.getAttribute('data-theme');if(a==='light'||a==='dark')return a;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';};
const ICON_SUN='<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.2M10 16v2.2M1.8 10H4M16 10h2.2M4.2 4.2l1.6 1.6M14.2 14.2l1.6 1.6M4.2 15.8l1.6-1.6M14.2 5.8l1.6-1.6"/></svg>';
const ICON_MOON='<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M16.5 12.6A7 7 0 017.4 3.5a7 7 0 109.1 9.1z"/></svg>';
function applyTheme(t,save){themePref=t==='light'||t==='dark'?t:null;const r=document.documentElement;
  if(themePref)r.setAttribute('data-theme',themePref);else if(save)r.removeAttribute('data-theme');
  if(save){try{if(themePref)localStorage.setItem(THEME_KEY,themePref);else localStorage.removeItem(THEME_KEY);}catch(e){}}
  updateThemeUi();}
function updateThemeUi(){const b=$('#themeBtn');if(!b)return;const dark=effectiveTheme()==='dark';
  b.innerHTML=dark?ICON_SUN:ICON_MOON;b.title=dark?'Włącz tryb jasny':'Włącz tryb ciemny';b.setAttribute('aria-label',b.title);
  const r=document.querySelector(`input[name=themeMode][value="${themePref||'system'}"]`);if(r)r.checked=true;}
(function initTheme(){let t=null;try{t=localStorage.getItem(THEME_KEY);}catch(e){}if(t)applyTheme(t,false);
  new MutationObserver(()=>{if(themePref&&document.documentElement.getAttribute('data-theme')!==themePref)document.documentElement.setAttribute('data-theme',themePref);updateThemeUi();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',updateThemeUi);}catch(e){}})();

function loadPrefs(){const p=store.get(PREF_KEY);if(!p)return;
  for(const k of ['treeMode','focusId','ancDepth','descDepth','showSibs']) if(p[k]!==undefined) S[k]=p[k];}
function savePrefs(){store.set(PREF_KEY,{treeMode:S.treeMode,focusId:S.focusId,ancDepth:S.ancDepth,descDepth:S.descDepth,showSibs:S.showSibs});}

function startLocal(){
  S.mode='local';const d=store.get(LOCAL_KEY);
  if(d){for(const col of ['people','unions','meta']) for(const o of (d[col]||[])) if(o&&o.id) C[col].set(o.id,o);}
  S.loaded=true;S.slow=false;scheduleRender();
}
function saveLocal(){
  const ok=store.set(LOCAL_KEY,{people:[...C.people.values()],unions:[...C.unions.values()],meta:[...C.meta.values()]});
  if(!ok){S.writeErr=true;toast('Nie udało się zapisać w pamięci przeglądarki (brak miejsca?). Pobierz kopię zapasową JSON.','err');}
  else S.writeErr=false;
  renderStatus();
}
const chains=new Map();
function writeDoc(col,id,obj){
  const key=col+'/'+id;const prev=chains.get(key)||Promise.resolve();
  const p=prev.catch(()=>{}).then(()=>doWrite(col,id,obj,0));chains.set(key,p);return p;
}
async function doWrite(col,id,obj,attempt){
  try{const ref=db.collection(col).doc(id);if(obj)await ref.set(obj);else await ref.delete();}
  catch(e){const c=e&&e.code;
    if((c==='unavailable'||c==='resource_exhausted')&&attempt<4){await sleep(500*(attempt+1)*(1+Math.random()));return doWrite(col,id,obj,attempt+1);}
    if(c==='invalid_argument'&&S.canWrite!==true){setReadonly(true);toast('Nie masz uprawnień administratora. Możesz tylko oglądać drzewo.','err');}
    else if(c==='invalid_argument')toast('Nie udało się zapisać. Dane osoby mogą być za duże (np. zdjęcie).','err');
    else if(c==='quota_exceeded')toast('Brak miejsca na dane. Usuń część zdjęć lub osób.','err');
    else if(c==='revoked'){setReadonly(true);}
    else toast('Nie udało się zapisać zmian. Sprawdź połączenie i spróbuj ponownie.','err');
    S.writeErr=true;throw e;}
}
async function pool(items,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const it=items[i++];await fn(it);}}));}
async function persist(list){
  const seen=new Map();for(const it of list)seen.set(it.col+'/'+it.id,it);const uniq=[...seen.values()];
  if(S.mode!=='db'){saveLocal();return true;}
  S.pending+=uniq.length;S.writeErr=false;renderStatus();let ok=true;
  await pool(uniq,6,async it=>{try{const o=it.obj?clone(it.obj):null;if(o)delete o.id;await writeDoc(it.col,it.id,o);}catch(e){ok=false;}finally{S.pending--;renderStatus();}});
  return ok;
}
const undoStack=[];
async function commit(changes,label,{undo=true}={}){
  if(S.readonly){toast(S.preview?'Jesteś w widoku gościa. Wróć do edycji przyciskiem u góry.':'Możesz tylko oglądać to drzewo. Edytuje administrator.','err');return false;}
  if(!S.loaded){toast('Poczekaj chwilę, drzewo jeszcze się wczytuje.');return false;}
  const rec=[];
  for(const ch of changes){const m=C[ch.col];const id=ch.del||ch.obj.id;
    rec.push({col:ch.col,id,before:clone(m.get(id))||null});
    if(ch.del)m.delete(id);else m.set(id,clone(ch.obj));}
  if(undo){undoStack.push({label,rec});if(undoStack.length>40)undoStack.shift();}
  scheduleRender();
  return persist(rec.map(r=>({col:r.col,id:r.id,obj:C[r.col].get(r.id)||null})));
}
async function undo(){
  if(S.readonly)return;const u=undoStack.pop();if(!u){toast('Nie ma czego cofnąć.');return;}
  const list=[];for(const r of u.rec.slice().reverse()){const m=C[r.col];if(r.before)m.set(r.id,clone(r.before));else m.delete(r.id);list.push({col:r.col,id:r.id,obj:r.before});}
  scheduleRender();toast('Cofnięto: '+u.label);await persist(list);
}
function applyRole(){S.readonly=S.role!=='admin'||S.preview;document.body.classList.toggle('ro',S.readonly);
  if(S.readonly){closeModal&&!$('#modal').hidden&&closeModal();panelConfirm=false;}renderRole();renderStatus();scheduleRender();}
function setReadonly(v){if(v)S.role='visitor';applyRole();}
const ICON_EDIT='<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M10.5 2.5l3 3L6 13H3v-3z"/></svg>';
const ICON_EYE='<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M1 8s2.6-5 7-5 7 5 7 5-2.6 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/></svg>';
function renderRole(){const b=$('#roleBtn');if(!b)return;
  if(S.role==='?'){b.hidden=true;return;}b.hidden=false;
  if(S.role!=='admin'){b.className='role view';b.innerHTML=ICON_EYE+'<span class="rl">Tylko podgląd</span>';b.title='Możesz oglądać drzewo. Edytować może tylko administrator.';b.setAttribute('aria-label','Tylko podgląd');return;}
  if(S.preview){b.className='role preview';b.innerHTML=ICON_EYE+'<span class="rl">Widok gościa · wróć do edycji</span>';b.title='Tak drzewo widzą goście. Kliknij, aby wrócić do edycji.';b.setAttribute('aria-label','Wróć do edycji');}
  else{b.className='role';b.innerHTML=ICON_EDIT+'<span class="rl">Administrator</span>';b.title='Możesz edytować. Kliknij, aby zobaczyć, jak drzewo widzą goście.';b.setAttribute('aria-label','Administrator – pokaż widok gościa');}}

async function initStore(){
  let tries=0;while(!(window.claude&&typeof window.claude.use==='function')&&tries<8){await sleep(150);tries++;}
  if(!(window.claude&&typeof window.claude.use==='function')){startLocal();return;}
  const slowT=setTimeout(()=>{if(!S.loaded){S.slow=true;scheduleRender();}},10000);
  let d=null;try{d=await window.claude.use('db');}catch(e){d=null;}
  if(!d){clearTimeout(slowT);startLocal();return;}
  db=d;S.mode='db';S.role='?';applyRole();
  window.claude.use('user').then(async u=>{
    if(!u){S.role='admin';applyRole();return;}
    let ce=null;try{ce=await u.canEdit();}catch(e){ce=null;}
    S.canWrite=ce;S.role=ce===false?'visitor':'admin';applyRole();
  }).catch(()=>{S.role='admin';applyRole();});
  const got={};
  for(const col of ['people','unions','meta']){
    db.collection(col).onSnapshot(snap=>{
      const m=C[col];m.clear();for(const doc of snap.docs){const v=doc.data();if(v)m.set(doc.id,Object.assign({},v,{id:doc.id}));}
      got[col]=true;if(got.people&&got.unions&&got.meta)S.loaded=true;
      if(!snap.metadata.fromCache){clearTimeout(slowT);S.slow=false;}
      scheduleRender();
    },err=>{clearTimeout(slowT);S.loaded=true;S.slow=false;S.dbError=err&&err.code;
      if(err&&err.code==='revoked')setReadonly(true);
      toast('Połączenie z zapisanymi danymi zostało przerwane. Odśwież stronę.','err');scheduleRender();});
  }
}
let dlCap;
async function getDl(){if(dlCap!==undefined)return dlCap;dlCap=null;
  if(window.claude&&typeof window.claude.use==='function'){try{dlCap=await window.claude.use('downloads');}catch(e){dlCap=null;}}return dlCap;}
async function saveFile(name,data,mime){
  const d=await getDl();
  if(d){try{await d.save({filename:name,data});toast('Zapisano: '+name);}catch(e){if(e&&e.code==='declined')return;toast('Nie udało się zapisać pliku ('+((e&&e.code)||'błąd')+').','err');}return;}
  try{const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
  catch(e){toast('Pobieranie plików nie działa w tym widoku.','err');}
}

/* ============ index ============ */
let IDX={children:new Map(),unionsBy:new Map()};
function byBirth(a,b){return (dateNum(a.birthDate)??9e9)-(dateNum(b.birthDate)??9e9)||nameOf(a).localeCompare(nameOf(b),'pl');}
function buildIndex(){
  const children=new Map(),unionsBy=new Map();
  for(const p of C.people.values())for(const k of ['fatherId','motherId']){const par=p[k];if(par&&C.people.has(par)&&par!==p.id){if(!children.has(par))children.set(par,[]);children.get(par).push(p);}}
  for(const a of children.values())a.sort(byBirth);
  for(const u of C.unions.values()){if(!C.people.has(u.a)||!C.people.has(u.b)||u.a===u.b)continue;for(const x of [u.a,u.b]){if(!unionsBy.has(x))unionsBy.set(x,[]);unionsBy.get(x).push(u);}}
  for(const a of unionsBy.values())a.sort((x,y)=>(dateNum(x.date)??9e9)-(dateNum(y.date)??9e9));
  IDX={children,unionsBy};
}
const kidsOf=id=>IDX.children.get(id)||[];
const unionsOf=id=>IDX.unionsBy.get(id)||[];
const parentsOf=p=>p?[p.fatherId,p.motherId].filter(x=>x&&C.people.has(x)&&x!==p.id):[];
function otherParent(c,pid){const o=c.fatherId===pid?c.motherId:c.motherId===pid?c.fatherId:null;return o&&C.people.has(o)?o:null;}
function unionBetween(a,b){return unionsOf(a).find(u=>u.a===b||u.b===b)||null;}
function partnersList(pid){

  for(const c of kidsOf(pid)){const o=otherParent(c,pid);if(o&&!seen.has(o)){seen.add(o);out.push({sid:o,union:null});}}

}
const partnerIds=id=>partnersList(id).map(x=>x.sid);

function isAncestor(anc,of){const st=[of],seen=new Set();while(st.length){const x=P(st.pop());if(!x)continue;for(const par of parentsOf(x)){if(par===anc)return true;if(!seen.has(par)){seen.add(par);st.push(par);}}}return false;}
function searchPeople(q){const toks=norm(q).split(/\s+/).filter(Boolean);
  const all=[...C.people.values()].sort((a,b)=>nameOf(a).localeCompare(nameOf(b),'pl'));
  if(!toks.length)return all;
  return all.filter(p=>{const h=norm([p.firstName,p.middleName,p.lastName,p.maidenName,p.nickname,p.birthPlace,yearOf(p.birthDate)].join(' '));return toks.every(t=>h.includes(t));});}
function defaultFocus(){
  let best=null,score=-1;
  for(const p of C.people.values()){let s=0;const up=[p.id],seen=new Set();
    while(up.length){const x=P(up.pop());for(const par of parentsOf(x))if(!seen.has(par)){seen.add(par);up.push(par);}}
    s+=seen.size;const dn=[p.id],seen2=new Set();while(dn.length){for(const c of kidsOf(dn.pop()))if(!seen2.has(c.id)){seen2.add(c.id);dn.push(c.id);}}
    s+=seen2.size+Math.min(seen.size,seen2.size)*2+partnerIds(p.id).length*.5;if(s>score){score=s;best=p.id;}}
  return best;
}

/* ============ kinship ============ */
function upMap(id){const m=new Map([[id,{d:0,via:null}]]);let fr=[id],d=0;
  while(fr.length&&d<60){d++;const nx=[];for(const x of fr){for(const par of parentsOf(P(x)))if(!m.has(par)){m.set(par,{d,via:x});nx.push(par);}}fr=nx;}return m;}
function bloodRel(aId,bId){

  if(!best)return null;
  const commons=[];for(const [id,ia] of A){const ib=B.get(id);if(ib&&ia.d===best.a&&ib.d===best.b)commons.push(id);}
  const path=(M,L)=>{const o=[L];let c=L;while(M.get(c).via){c=M.get(c).via;o.push(c);}return o.reverse();};
  return {a:best.a,b:best.b,lca:best.id,commons,pathA:path(A,best.id),pathB:path(B,best.id)};
}
const pra=n=>'pra'.repeat(Math.max(0,n));
function descTerm(b,p){if(b===1)return G(p,'syn','córka','dziecko');if(b===2)return G(p,'wnuk','wnuczka','wnuk/wnuczka');return pra(b-2)+G(p,'wnuk','wnuczka','wnuk/wnuczka');}
function ancTerm(a,p){if(a===1)return G(p,'ojciec','matka','rodzic');if(a===2)return G(p,'dziadek','babcia','dziadek/babcia');return pra(a-2)+G(p,'dziadek','babcia','dziadek/babcia');}
function ancGen(a,p){if(a===1)return G(p,'ojca','matki','rodzica');if(a===2)return G(p,'dziadka','babci','dziadka/babci');return pra(a-2)+G(p,'dziadka','babci','dziadka/babci');}
function kinTerm(r,A,B){
  const {a,b}=r;
  if(a===0&&b===0)return {term:'ta sama osoba'};
  if(a===0)return {term:descTerm(b,B)};
  if(b===0)return {term:ancTerm(a,B)};
  const sA=P(r.pathA[a-1]),sB=P(r.pathB[b-1]);const half=sA&&sB?isHalf(sA,sB):false;
  if(a===1&&b===1)return {term:G(B,'brat','siostra','rodzeństwo')+(half?G(B,' przyrodni',' przyrodnia',' przyrodnie'):''),half};
  if(a===1){
    if(b===2)return {term:sB.gender==='M'?G(B,'bratanek','bratanica','dziecko brata'):sB.gender==='K'?G(B,'siostrzeniec','siostrzenica','dziecko siostry'):G(B,'bratanek/siostrzeniec','bratanica/siostrzenica','dziecko rodzeństwa'),half};
    return {term:descTerm(b-1,B)+' '+G(sB,'brata','siostry','rodzeństwa'),half};
  }
  if(b===1){
    if(a===2){const par=P(r.pathA[1]);
      if(B.gender==='K')return {term:'ciotka',note:par.gender==='K'?'siostra matki':par.gender==='M'?'siostra ojca':'',half};
      if(B.gender==='M'&&par.gender==='K')return {term:'wuj',note:'brat matki',half};
      if(B.gender==='M'&&par.gender==='M')return {term:'stryj',note:'brat ojca',half};
      return {term:G(B,'brat','siostra','rodzeństwo')+' '+ancGen(1,par),half};}
    return {term:G(B,'brat','siostra','rodzeństwo')+' '+ancGen(a-1,sA),half};
  }
  if(a===2&&b===2){const pa=P(r.pathA[1]),pb=P(r.pathB[1]);let t=null;
    if(pb.gender==='K')t=G(B,'cioteczny','cioteczna',null);
    else if(pb.gender==='M'&&pa.gender==='K')t=G(B,'wujeczny','wujeczna',null);
    else if(pb.gender==='M'&&pa.gender==='M')t=G(B,'stryjeczny','stryjeczna',null);
    const base=G(B,'kuzyn','kuzynka','kuzyn/kuzynka');
    return t?{term:G(B,'brat','siostra')+' '+t,note:base+' 1. stopnia',half}:{term:base+' 1. stopnia',half};}
  if(a===2&&b===3){const pb=P(r.pathB[1]);return {term:G(B,'syn','córka','dziecko')+' '+G(pb,'kuzyna','kuzynki','kuzyna/kuzynki'),half};}
  if(a===3&&b===2){const pa=P(r.pathA[1]);return {term:G(B,'kuzyn','kuzynka','kuzyn/kuzynka')+' '+G(pa,'ojca','matki','rodzica'),half};}
  const deg=Math.min(a,b)-1,rem=Math.abs(a-b);
  let t=`${G(B,'kuzyn','kuzynka','kuzyn/kuzynka')} ${deg}. stopnia`;
  if(rem)t+=`, ${b>a?'młodsze':'starsze'} pokolenie (o ${rem})`;
  return {term:t,half};
}
function relation(aId,bId){
  const A=P(aId),B=P(bId);if(!A||!B)return null;
  if(aId===bId)return {kind:'same',term:'ta sama osoba'};
  const r=bloodRel(aId,bId);if(r)return Object.assign({kind:'blood',r},kinTerm(r,A,B));
  const spA=partnerIds(aId);
  if(spA.includes(bId)){const u=unionBetween(aId,bId);const ex=u&&u.status==='rozwod';
    const w=u&&u.status==='partnerzy'?G(B,'partner','partnerka','partner'):u?G(B,'mąż','żona','małżonek'):G(B,'partner','partnerka','partner');
    return {kind:'aff',term:(ex?G(B,'były ','była ','były/a '):'')+w};}
  for(const s of spA)if(parentsOf(P(s)).includes(bId))return {kind:'aff',term:G(B,'teść','teściowa','teść/teściowa'),via:s};
  for(const c of kidsOf(aId))if(partnerIds(c.id).includes(bId))return {kind:'aff',term:G(B,'zięć','synowa','zięć/synowa'),via:c.id};
  for(const par of parentsOf(A))if(partnerIds(par).includes(bId))return {kind:'aff',term:G(B,'ojczym','macocha','ojczym/macocha'),via:par};
  for(const s of spA)if(kidsOf(s).some(c=>c.id===bId))return {kind:'aff',term:G(B,'pasierb','pasierbica','pasierb/pasierbica'),via:s};
  for(const s of spA)if(siblingsOf(s).some(x=>x.p.id===bId))return {kind:'aff',term:G(B,'szwagier','szwagierka','szwagier/szwagierka'),via:s};
  for(const sib of siblingsOf(aId))if(partnerIds(sib.p.id).includes(bId))return {kind:'aff',term:(B.gender==='K'&&sib.p.gender==='M')?'bratowa':G(B,'szwagier','szwagierka','szwagier/szwagierka'),via:sib.p.id};
  for(const c of kidsOf(aId))for(const cs of partnerIds(c.id))if(parentsOf(P(cs)).includes(bId))return {kind:'aff',term:G(B,'swat','swatowa','swat/swatowa'),note:'rodzic współmałżonka dziecka',via:c.id};
  for(const s of spA){const r2=bloodRel(s,bId);if(r2)return {kind:'affvia',term:kinTerm(r2,P(s),B).term,via:s};}
  for(const s of partnerIds(bId)){const r2=bloodRel(aId,s);if(!r2)continue;const t=kinTerm(r2,A,P(s)).term;
    if(t==='ciotka'&&B.gender==='M')return {kind:'aff',term:'wujek',note:'mąż ciotki',via:s};
    if(t==='stryj'&&B.gender==='K')return {kind:'aff',term:'stryjenka',note:'żona stryja',via:s};
    if(t==='wuj'&&B.gender==='K')return {kind:'aff',term:'wujenka',note:'żona wuja',via:s};}
  for(const s of partnerIds(bId)){const r2=bloodRel(aId,s);if(r2)return {kind:'affspouse',term:G(B,'mąż','żona','partner'),of:s,ofTerm:kinTerm(r2,A,P(s)).term};}
  return null;
}

/* ============ GEDCOM ============ */
const GM=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function toGed(s){const p=parseDate(s);if(!p)return '';if(p.invalid)return String(s);
  const o=p.d&&p.m?`${p.d} ${GM[p.m-1]} ${p.y}`:p.m?`${GM[p.m-1]} ${p.y}`:String(p.y);
  return (p.q==='ok.'?'ABT ':p.q==='przed'?'BEF ':p.q==='po'?'AFT ':'')+o;}
function fromGed(s){if(!s)return '';let t=s.trim().toUpperCase(),q='';const m0=t.match(/^(ABT|EST|CAL|BEF|AFT|ABOUT|BET|FROM)\s+/);
  if(m0){q=m0[1]==='BEF'?'przed ':m0[1]==='AFT'?'po ':'ok. ';t=t.slice(m0[0].length);}let m;
  if((m=t.match(/^(\d{1,2})\s+([A-Z]{3})\s+(\d{3,4})/))){const mo=GM.indexOf(m[2])+1;if(mo)return q+`${m[3]}-${pad2(mo)}-${pad2(+m[1])}`;}
  if((m=t.match(/^([A-Z]{3})\s+(\d{3,4})/))){const mo=GM.indexOf(m[1])+1;if(mo)return q+`${m[2]}-${pad2(mo)}`;}
  if((m=t.match(/(\d{3,4})/)))return q+m[1];return '';}
function exportGedcom(){
  const L=[];const ids=new Map();let i=1;for(const p of C.people.values())ids.set(p.id,'@I'+(i++)+'@');
  const fams=new Map();const famKey=(f,m)=>(f||'-')+'|'+(m||'-');
  const famOf=(f,m)=>{const k=famKey(f,m);if(!fams.has(k))fams.set(k,{id:'@F'+(fams.size+1)+'@',h:f,w:m,kids:[],u:null});return fams.get(k);};
  for(const u of C.unions.values()){if(!C.people.has(u.a)||!C.people.has(u.b))continue;const A=P(u.a),B=P(u.b);
    const [h,w]=(A.gender==='K'||B.gender==='M')?[u.b,u.a]:[u.a,u.b];famOf(h,w).u=u;}
  for(const p of C.people.values()){const f=p.fatherId&&C.people.has(p.fatherId)?p.fatherId:null,m=p.motherId&&C.people.has(p.motherId)?p.motherId:null;
    if(!f&&!m)continue;let fam=fams.get(famKey(f,m))||fams.get(famKey(m,f));if(!fam)fam=famOf(f,m);fam.kids.push(p.id);}
  const txt=(lvl,tag,v)=>{const lines=String(v).split(/\r?\n/);L.push(`${lvl} ${tag} ${lines[0]}`.trimEnd());for(const x of lines.slice(1))L.push(`${lvl+1} CONT ${x}`.trimEnd());};
  L.push('0 HEAD','1 SOUR KRONIKA_RODU','2 NAME Kronika Rodu','1 GEDC','2 VERS 5.5.1','2 FORM LINEAGE-LINKED','1 CHAR UTF-8','1 LANG Polish');
  for(const p of C.people.values()){
    L.push(`0 ${ids.get(p.id)} INDI`);const given=givenOf(p);
    const birthSur=p.maidenName||p.lastName||'';
    L.push(`1 NAME ${given} /${birthSur}/`.replace(/\s+/g,' '));if(given)L.push('2 GIVN '+given);if(birthSur)L.push('2 SURN '+birthSur);if(p.nickname)L.push('2 NICK '+p.nickname);
    if(p.maidenName&&p.lastName&&p.maidenName!==p.lastName){L.push(`1 NAME ${given} /${p.lastName}/`.replace(/\s+/g,' '),'2 TYPE married');}

    if(p.birthDate||p.birthPlace){L.push('1 BIRT');if(p.birthDate)L.push('2 DATE '+toGed(p.birthDate));if(p.birthPlace)L.push('2 PLAC '+p.birthPlace);}
    if(p.deceased){if(p.deathDate||p.deathPlace||p.deathCause){L.push('1 DEAT');if(p.deathDate)L.push('2 DATE '+toGed(p.deathDate));if(p.deathPlace)L.push('2 PLAC '+p.deathPlace);if(p.deathCause)L.push('2 CAUS '+p.deathCause);}else L.push('1 DEAT Y');
      if(p.burialPlace){L.push('1 BURI','2 PLAC '+p.burialPlace);}}

  }
  for(const f of fams.values()){L.push(`0 ${f.id} FAM`);if(f.h)L.push('1 HUSB '+ids.get(f.h));if(f.w)L.push('1 WIFE '+ids.get(f.w));

      if(f.u.status==='rozwod'){L.push('1 DIV');if(f.u.endDate)L.push('2 DATE '+toGed(f.u.endDate));}}}

function parseGedcom(text){
  const recs=[];const st=[];
  for(const raw of text.split(/\r?\n/)){const line=raw.replace(/^﻿/,'').trim();if(!line)continue;
    const m=line.match(/^(\d+)\s+(@[^@]+@\s+)?(\S+)(?:\s(.*))?$/);if(!m)continue;const lvl=+m[1];
    const node={tag:m[3].toUpperCase(),xref:m[2]?m[2].trim():null,val:m[4]??'',kids:[]};
    if(lvl===0){recs.push(node);st.length=0;st[0]=node;continue;}
    const par=st[lvl-1];if(!par)continue;
    if(node.tag==='CONT'){par.val+='\n'+node.val;continue;}if(node.tag==='CONC'){par.val+=node.val;continue;}
    par.kids.push(node);st[lvl]=node;st.length=lvl+1;}
  const sub=(n,t)=>n&&n.kids.find(k=>k.tag===t);const subs=(n,t)=>n?n.kids.filter(k=>k.tag===t):[];
  const v=(n,path)=>{let x=n;for(const t of path.split('.'))x=sub(x,t);return x?x.val.trim():'';};
  const notes=new Map(recs.filter(r=>r.tag==='NOTE'&&r.xref).map(r=>[r.xref,r.val]));
  const map=new Map();const people=[],unions=[];
  for(const r of recs){if(r.tag!=='INDI')continue;const id=uid('p');map.set(r.xref,id);
    const names=subs(r,'NAME');const birthN=names.find(n=>{const t=v(n,'TYPE').toLowerCase();return !t||t==='birth';})||names[0];
    const marN=names.find(n=>v(n,'TYPE').toLowerCase()==='married');
    const parse=n=>{if(!n)return {g:'',s:''};const raw=n.val||'';const s=v(n,'SURN')||((raw.match(/\/([^\/]*)\//)||[])[1]||'');
      const g=v(n,'GIVN')||raw.replace(/\/[^\/]*\/?/g,' ').replace(/\s+/g,' ').trim();return {g,s:s.trim()};};
    const bn=parse(birthN),mn=parse(marN);const gp=bn.g.split(/\s+/).filter(Boolean);
    const sex=v(r,'SEX').toUpperCase();const deat=sub(r,'DEAT');
    let nt=subs(r,'NOTE').map(n=>notes.get(n.val.trim())||n.val).filter(Boolean).join('\n\n');
    const p={id,firstName:gp[0]||'',middleName:gp.slice(1).join(' '),lastName:mn.s||bn.s,maidenName:mn.s&&bn.s&&mn.s!==bn.s?bn.s:'',
      nickname:birthN?v(birthN,'NICK'):'',gender:sex==='M'?'M':sex==='F'?'K':'N',
      birthDate:fromGed(v(r,'BIRT.DATE')||v(r,'CHR.DATE')||v(r,'BAPM.DATE')),birthPlace:v(r,'BIRT.PLAC')||v(r,'CHR.PLAC'),
      deceased:!!(deat||sub(r,'BURI')),deathDate:fromGed(v(r,'DEAT.DATE')),deathPlace:v(r,'DEAT.PLAC'),deathCause:v(r,'DEAT.CAUS'),
      burialPlace:v(r,'BURI.PLAC'),occupation:v(r,'OCCU'),residence:v(r,'RESI.PLAC')||v(r,'RESI'),notes:nt,
      events:subs(r,'EVEN').map(e=>({date:fromGed(v(e,'DATE')),title:v(e,'TYPE')||e.val,place:v(e,'PLAC')})).filter(e=>e.title||e.date)};
    people.push(p);}
  const byId=new Map(people.map(p=>[p.id,p]));
  for(const r of recs){if(r.tag!=='FAM')continue;const h=map.get(v(r,'HUSB')),w=map.get(v(r,'WIFE'));
    for(const c of subs(r,'CHIL')){const k=byId.get(map.get(c.val.trim()));if(k){if(h)k.fatherId=h;if(w)k.motherId=w;}}
    if(h&&w){const div=sub(r,'DIV');unions.push({id:uid('u'),a:h,b:w,date:fromGed(v(r,'MARR.DATE')),place:v(r,'MARR.PLAC'),status:div?'rozwod':'malzenstwo',endDate:div?fromGed(v(r,'DIV.DATE')):''});}}
  return {people,unions};
}

/* ============ sanitize ============ */
const PKEYS=['id','firstName','middleName','lastName','maidenName','nickname','gender','birthDate','birthPlace','deceased','deathDate','deathPlace','burialPlace','deathCause','occupation','residence','notes','sources','photo','events','fatherId','motherId','example'];
const UKEYS=['id','a','b','date','place','status','endDate','notes','example'];
function cleanPerson(o){const p={};for(const k of PKEYS){if(o[k]===undefined||o[k]===null||o[k]==='')continue;p[k]=o[k];}
  for(const k of PKEYS)if(typeof p[k]==='string')p[k]=p[k].slice(0,k==='notes'||k==='sources'?20000:k==='photo'?200000:300);
  if(p.photo&&!/^data:image\//.test(p.photo))delete p.photo;
  if(!['M','K','N'].includes(p.gender))p.gender='N';p.deceased=!!p.deceased;
  if(Array.isArray(p.events))p.events=p.events.filter(e=>e&&(e.title||e.date)).slice(0,100).map(e=>({date:String(e.date||'').slice(0,40),title:String(e.title||'').slice(0,200),place:String(e.place||'').slice(0,200)}));else delete p.events;
  return p;}
function cleanUnion(o){const u={};for(const k of UKEYS)if(o[k]!==undefined&&o[k]!==null&&o[k]!=='')u[k]=typeof o[k]==='string'?o[k].slice(0,2000):o[k];
  if(!['malzenstwo','partnerzy','rozwod','separacja'].includes(u.status))u.status='malzenstwo';return u;}

function renderStatus(){const el=$('#status');if(!el)return;let cls='',txt;
  if(!S.loaded)txt='Wczytywanie…';
  else if(S.role==='?'){cls='ro';txt='Sprawdzanie uprawnień…';}
  else if(S.readonly){cls='ro';txt=S.preview?'Widok gościa':'Tylko podgląd';}
  else if(S.pending>0){cls='saving';txt='Zapisywanie…';}
  else if(S.writeErr){cls='err';txt='Błąd zapisu';}

  el.title=S.mode==='local'?'Dane są zapisane tylko w tej przeglądarce. Rób kopie zapasowe w zakładce „Dane i eksport”.':'Zmiany zapisują się automatycznie.';}
function refreshDatalists(){
  const places=new Set(),sur=new Set();
  for(const p of C.people.values()){for(const k of ['birthPlace','deathPlace','burialPlace','residence'])if(p[k])places.add(p[k]);if(p.lastName)sur.add(p.lastName);if(p.maidenName)sur.add(p.maidenName);}
  for(const u of C.unions.values())if(u.place)places.add(u.place);
  $('#dlPlaces').innerHTML=[...places].sort((a,b)=>a.localeCompare(b,'pl')).map(x=>`<option value="${esc(x)}">`).join('');
  $('#dlSurnames').innerHTML=[...sur].sort((a,b)=>a.localeCompare(b,'pl')).map(x=>`<option value="${esc(x)}">`).join('');}
function toast(msg,kind,action){const t=document.createElement('div');t.className='toast'+(kind==='err'?' err':'');t.textContent=msg;
  if(action){const b=document.createElement('button');b.textContent=action.label;b.onclick=()=>{action.fn();t.remove();};t.appendChild(b);}
  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),kind==='err'?7000:4200);}

/* ============ tree layout ============ */
const W=188,H=66,HG=26,SG=34,VG=62,RH=H+VG;
const F1='600 14px "Instrument Sans", system-ui, sans-serif',F2='500 13px "Instrument Sans", system-ui, sans-serif',F3='400 11.5px "IBM Plex Mono", ui-monospace, monospace';
const mctx=document.createElement('canvas').getContext('2d');
function fitText(t,font,max){mctx.font=font;if(mctx.measureText(t).width<=max)return t;let s=t;while(s.length>1&&mctx.measureText(s+'…').width>max)s=s.slice(0,-1);return s.trimEnd()+'…';}
function levelLabel(l){if(l===0)return '';const up=['','Rodzice','Dziadkowie','Pradziadkowie','Prapradziadkowie'],dn=['','Dzieci','Wnuki','Prawnuki','Praprawnuki'];
  if(l<0)return up[-l]||`${pra(-l-2)}dziadkowie`;return dn[l]||`${pra(l-2)}wnuki`;}

function layoutTree(fid){
  const L={nodes:[],edges:[],dashed:[],marks:[],levels:new Set([0]),pos:new Map()};
  const add=(pid,x,level,extra={})=>{const y=level*RH;L.nodes.push(Object.assign({pid,x,y,level},extra));L.levels.add(level);if(!L.pos.has(pid)||extra.focus)L.pos.set(pid,{x,y});};
  const seg=(arr,pts)=>arr.push('M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L'));
  function buildDesc(pid,depth){
    const partners=partnersList(pid),kids=kidsOf(pid),groups=[];
    if(depth>0){for(const pt of partners){const ch=kids.filter(c=>otherParent(c,pid)===pt.sid);if(ch.length)groups.push({partner:pt.sid,union:pt.union,children:ch.map(c=>buildDesc(c.id,depth-1))});}
      const solo=kids.filter(c=>!otherParent(c,pid));if(solo.length)groups.push({partner:null,children:solo.map(c=>buildDesc(c.id,depth-1))});}
    let order=[pid,...partners.map(p=>p.sid)];
    if(partners.length===1&&P(pid).gender==='K'&&P(partners[0].sid).gender!=='K')order=[partners[0].sid,pid];
    const n=order.length,unitW=n*W+(n-1)*SG;const all=groups.flatMap(g=>g.children);
    const kidsW=all.length?all.reduce((s,c)=>s+c.width,0)+HG*(all.length-1):0;
    return {pid,partners,groups,order,unitW,kidsW,width:Math.max(unitW,kidsW),hidden:depth>0?0:kids.length};
  }
  function placeDesc(node,left,level){
    const unitLeft=left+(node.width-node.unitW)/2,xs={};
    node.order.forEach((id,i)=>{const x=unitLeft+i*(W+SG);xs[id]=x;
      add(id,x,level,{focus:id===fid&&level===0,partner:id!==node.pid,more:id===node.pid&&node.hidden?node.hidden:0,up:level>0&&id!==node.pid&&parentsOf(P(id)).length>0});});
    const mx=xs[node.pid],ymid=level*RH+H/2,up={};
    node.partners.forEach((pt,i)=>{const px=xs[pt.sid];const yy=ymid+(i?i*5:0);
      seg(pt.union?L.edges:L.dashed,[[Math.min(mx,px)+W,yy],[Math.max(mx,px),yy]]);
      const ux=px>mx?px-SG/2:px+W+SG/2;up[pt.sid]=[ux,yy];if(pt.union)L.marks.push({x:ux,y:yy,u:pt.union});});
    let cx=left+(node.width-node.kidsW)/2;const ng=node.groups.length;
    node.groups.forEach((g,gi)=>{
      const centers=g.children.map(ch=>{const c=placeDesc(ch,cx,level+1);cx+=ch.width+HG;return c;});
      const src=g.partner?up[g.partner]:[mx+W/2,level*RH+H];
      const busY=(level+1)*RH-VG/2+(gi-(ng-1)/2)*7;
      seg(L.edges,[src,[src[0],busY]]);
      seg(L.edges,[[Math.min(src[0],...centers),busY],[Math.max(src[0],...centers),busY]]);
      for(const c of centers)seg(L.edges,[[c,busY],[c,(level+1)*RH]]);
    });
    return mx+W/2;
  }
  function ancW(id,depth){if(depth<=0)return W;const ps=parentsOf(P(id));if(!ps.length)return W;
    return Math.max(W,ps.reduce((s,x)=>s+ancW(x,depth-1),0)+HG*(ps.length-1));}
  function placeAnc(pid,cx,level,depth,isFocus){
    if(depth<=0)return null;const p=P(pid),par=[];
    for(const slot of ['fatherId','motherId']){const id=p[slot];
      if(id&&C.people.has(id)&&id!==pid)par.push({id,slot,w:ancW(id,depth-1)});else if(isFocus&&!S.readonly)par.push({ghost:slot,w:W});}
    if(!par.length)return null;
    const total=par.reduce((s,q)=>s+q.w,0)+HG*(par.length-1);let x=cx-total/2;const res={};
    for(const q of par){const c=x+q.w/2;q.c=c;
      if(q.ghost)L.nodes.push({ghost:q.ghost,for:pid,x:c-W/2,y:(level-1)*RH,level:level-1});
      else{add(q.id,c-W/2,level-1,{up:depth-1<=0&&parentsOf(P(q.id)).length>0});placeAnc(q.id,c,level-1,depth-1,false);}
      if((q.slot||q.ghost)==='fatherId')res.fc=c;else res.mc=c;x+=q.w+HG;}
    L.levels.add(level-1);
    const ymid=(level-1)*RH+H/2,bottom=(level-1)*RH+H,busY=level*RH-VG/2;let src;
    const anyGhost=par.some(q=>q.ghost);
    if(par.length===2){const a=par[0].c+W/2,b=par[1].c-W/2;seg(anyGhost?L.dashed:L.edges,[[a,ymid],[b,ymid]]);src=[(a+b)/2,ymid];
      if(!anyGhost){const u=unionBetween(par[0].id,par[1].id);if(u)L.marks.push({x:src[0],y:ymid,u});}}
    else src=[par[0].c,bottom];
    seg(par.every(q=>q.ghost)?L.dashed:L.edges,[src,[src[0],busY],[cx,busY],[cx,level*RH]]);
    res.src=anyGhost?null:src;return res;
  }
  const desc=buildDesc(fid,S.descDepth);
  const fc=placeDesc(desc,0,0);
  const unitLeft=(desc.width-desc.unitW)/2,unitRight=unitLeft+desc.unitW;
  const sibs=S.showSibs&&S.ancDepth>0?siblingsOf(fid):[];
  const fb=dateNum(P(fid).birthDate);const older=[],younger=[];
  for(const s of sibs){const sb=dateNum(s.p.birthDate);(fb!=null&&sb!=null&&sb>fb?younger:older).push(s);}
  const sibPos=[];let x=unitLeft;
  for(const s of older.slice().reverse()){x-=W+HG;add(s.p.id,x,0,{sib:true,half:s.half,more:kidsOf(s.p.id).length});sibPos.push({s,cx:x+W/2});}
  x=unitRight;for(const s of younger){x+=HG;add(s.p.id,x,0,{sib:true,half:s.half,more:kidsOf(s.p.id).length});sibPos.push({s,cx:x+W/2});x+=W;}
  const top=placeAnc(fid,fc,0,S.ancDepth,true);
  if(top){const F=P(fid);
    for(const {s,cx} of sibPos){const sf=F.fatherId&&s.p.fatherId===F.fatherId,sm=F.motherId&&s.p.motherId===F.motherId;
      if(sf&&sm&&top.src){const by=-VG/2;seg(L.edges,[[top.src[0],by],[cx,by],[cx,0]]);}
      else if(sf||sm){const pc=sf?top.fc:top.mc;if(pc==null)continue;const by=-VG/2+9;seg(L.edges,[[pc,-VG],[pc,by],[cx,by],[cx,0]]);}}}
  return L;
}
/* ============ whole-tree layout ============ */
function roman(n){const m=[[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const [v,r] of m)while(n>=v){s+=r;n-=v;}return s;}
function resolveRow(des,ws,gaps){const n=des.length,off=[];let o=0;for(let i=0;i<n;i++){if(i)o+=ws[i-1]+gaps[i];off.push(o);}
  const bl=[];for(let i=0;i<n;i++){bl.push({v:des[i]-off[i],n:1});while(bl.length>1&&bl[bl.length-2].v>bl[bl.length-1].v){const b=bl.pop(),a=bl.pop();bl.push({v:(a.v*a.n+b.v*b.n)/(a.n+b.n),n:a.n+b.n});}}
  const out=[];let i=0;for(const b of bl)for(let k=0;k<b.n;k++){out.push(b.v+off[i]);i++;}return out;}
function layoutFull(){
  const L={nodes:[],edges:[],dashed:[],marks:[],levels:new Set(),pos:new Map(),full:true,gens:0};
  const seg=(arr,pts)=>arr.push('M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L'));
  const ids=[...C.people.values()].sort(byBirth).map(p=>p.id);
  const nb=id=>[...parentsOf(P(id)),...kidsOf(id).map(c=>c.id),...partnerIds(id)];
  const comp=new Map(),comps=[];
  for(const id of ids){if(comp.has(id))continue;const k=comps.length,mem=[],st=[id];comp.set(id,k);
    while(st.length){const x=st.pop();mem.push(x);for(const y of nb(x))if(!comp.has(y)){comp.set(y,k);st.push(y);}}comps.push(mem);}
  comps.sort((a,b)=>b.length-a.length);
  let ox=0;
  for(const mem of comps){
    const set=new Set(mem),lv=new Map(mem.map(id=>[id,0])),cap=mem.length+2;
    const pars=id=>parentsOf(P(id)).filter(x=>set.has(x));
    for(let it=0;it<100;it++){let ch=false;
      for(const id of mem){let v=lv.get(id);for(const q of pars(id))v=Math.max(v,lv.get(q)+1);for(const s2 of partnerIds(id))v=Math.max(v,lv.get(s2));v=Math.min(v,cap);if(v!==lv.get(id)){lv.set(id,v);ch=true;}}
      for(const id of mem){if(pars(id).length)continue;const ks=kidsOf(id);if(!ks.length)continue;const m=Math.min(...ks.map(k=>lv.get(k.id)))-1;if(m>lv.get(id)){lv.set(id,m);ch=true;}}
      if(!ch)break;}
    const minL=Math.min(...lv.values());for(const [k,v] of lv)lv.set(k,v-minL);
    const maxL=Math.max(...lv.values());L.gens=Math.max(L.gens,maxL+1);
    // units: partners on the same row stay together
    const unitOf=new Map(),rows=Array.from({length:maxL+1},()=>[]);
    for(const id of mem.slice().sort((a,b)=>byBirth(P(a),P(b)))){if(unitOf.has(id))continue;const l=lv.get(id),m=[],st=[id],seen=new Set([id]);
      while(st.length){const x=st.pop();m.push(x);for(const s2 of partnerIds(x))if(!seen.has(s2)&&lv.get(s2)===l&&!unitOf.has(s2)){seen.add(s2);st.push(s2);}}
      let order;
      if(m.length===1)order=m;
      else if(m.length===2)order=(P(m[0]).gender==='K'&&P(m[1]).gender!=='K')?[m[1],m[0]]:m;
      else{const hub=m.slice().sort((x,y)=>partnerIds(y).length-partnerIds(x).length)[0];const rest=m.filter(x=>x!==hub);order=[rest[0],hub,...rest.slice(1)];}
      const u={members:order,level:l,w:order.length*W+(order.length-1)*SG,x:0};order.forEach(x=>unitOf.set(x,u));rows[l].push(u);}
    const mc=id=>{const u=unitOf.get(id);return u.x+u.members.indexOf(id)*(W+SG)+W/2;};
    const avg=a=>a.length?a.reduce((s2,x)=>s2+x,0)/a.length:null;
    const pc=id=>avg(pars(id).map(mc));
    const down=u=>avg(u.members.flatMap(id=>pars(id).map(mc)));
    const up=u=>avg(u.members.flatMap(id=>kidsOf(id).filter(c=>set.has(c.id)).map(c=>mc(c.id))));
    const pack=row=>{let x=0;for(const u of row){u.x=x;x+=u.w+HG;}};
    rows.forEach(pack);
    const reorder=(row,fn)=>{const k=row.map((u,i)=>({u,k:fn(u)??(u.x+u.w/2),i}));k.sort((a,b)=>a.k-b.k||a.i-b.i);row.splice(0,row.length,...k.map(o=>o.u));pack(row);};
    for(let r=0;r<4;r++){for(let l=1;l<=maxL;l++)reorder(rows[l],down);for(let l=maxL-1;l>=0;l--)reorder(rows[l],up);}
    for(let l=1;l<=maxL;l++)reorder(rows[l],down);
    for(const row of rows)for(const u of row)if(u.members.length===2){const a=pc(u.members[0]),b=pc(u.members[1]);if(a!=null&&b!=null&&a>b)u.members.reverse();}
    const famGap=(a,b)=>{const fa=new Set(a.members.flatMap(pars));return b.members.some(id=>pars(id).some(q=>fa.has(q)))?HG:HG*2.4;};
    for(let it=0;it<14;it++)for(let l=0;l<=maxL;l++){const row=rows[l];if(!row.length)continue;
      const des=row.map(u=>{const v=[];u.members.forEach((id,i)=>{const c=pc(id);if(c!=null)v.push(c-(i*(W+SG)+W/2));});const k=up(u);if(k!=null){v.push(k-u.w/2);if(!v.length||it>8)v.push(k-u.w/2);}return v.length?avg(v):u.x;});
      const xs=resolveRow(des,row.map(u=>u.w),row.map((u,i)=>i?famGap(row[i-1],u):0));row.forEach((u,i)=>{u.x=xs[i];});}
    let minX=Infinity,maxX=-Infinity;for(const row of rows)for(const u of row){minX=Math.min(minX,u.x);maxX=Math.max(maxX,u.x+u.w);}
    const sh=ox-minX;
    for(const row of rows)for(const u of row){u.x+=sh;u.members.forEach((id,i)=>{const x=u.x+i*(W+SG);L.nodes.push({pid:id,x,y:u.level*RH,level:u.level});L.pos.set(id,{x,y:u.level*RH});});L.levels.add(u.level);}
    // couples
    const key=(a,b)=>a<b?a+'|'+b:b+'|'+a;const upt=new Map();
    for(const row of rows)for(const u of row){const ym=u.level*RH+H/2;
      for(let i=0;i<u.members.length;i++)for(let j=i+1;j<u.members.length;j++){const a=u.members[i],b=u.members[j];const pt=partnersList(a).find(x=>x.sid===b);if(!pt)continue;
        const xa=L.pos.get(a).x,xb=L.pos.get(b).x,yy=ym+(j-i-1)*6;seg(pt.union?L.edges:L.dashed,[[xa+W,yy],[xb,yy]]);
        const ux=xb-SG/2;upt.set(key(a,b),[ux,yy]);if(pt.union)L.marks.push({x:ux,y:yy,u:pt.union});}}
    // children
    const fams=new Map();
    for(const id of mem){const p=P(id);const f=p.fatherId&&set.has(p.fatherId)?p.fatherId:null,m=p.motherId&&set.has(p.motherId)?p.motherId:null;if(!f&&!m)continue;
      const k=(f||'')+'|'+(m||'');if(!fams.has(k))fams.set(k,{f,m,kids:[]});fams.get(k).kids.push(id);}
    const byRow=new Map();
    for(const fm of fams.values()){let src=null;if(fm.f&&fm.m)src=upt.get(key(fm.f,fm.m))||null;
      if(!src){const q=L.pos.get(fm.f||fm.m);src=[q.x+W/2,q.y+H];}fm.src=src;fm.row=Math.min(...fm.kids.map(k=>lv.get(k)));
      if(!byRow.has(fm.row))byRow.set(fm.row,[]);byRow.get(fm.row).push(fm);}
    for(const [r,list] of byRow){list.sort((a,b)=>a.src[0]-b.src[0]);list.forEach((fm,i)=>{const busY=r*RH-VG/2+((i%3)-1)*8;
      const cs=fm.kids.map(k=>L.pos.get(k).x+W/2);seg(L.edges,[fm.src,[fm.src[0],busY]]);
      seg(L.edges,[[Math.min(fm.src[0],...cs),busY],[Math.max(fm.src[0],...cs),busY]]);
      fm.kids.forEach((k,j)=>seg(L.edges,[[cs[j],busY],[cs[j],lv.get(k)*RH]]));});}
    ox+=maxX-minX+W;
  }
  return L;
}
function applyLineage(){const vp=$('#vp');if(!vp)return;const on=S.treeMode==='cale'&&S.selectedId&&C.people.has(S.selectedId)&&lastL&&lastL.full;
  vp.classList.toggle('lineage',!!on);if(!on){$$('#vp .node.dim').forEach(g=>g.classList.remove('dim'));return;}
  const keep=new Set(upMap(S.selectedId).keys());const st=[S.selectedId];while(st.length){for(const c of kidsOf(st.pop()))if(!keep.has(c.id)){keep.add(c.id);st.push(c.id);}}
  for(const s2 of partnerIds(S.selectedId))keep.add(s2);
  $$('#vp .node').forEach(g=>g.classList.toggle('dim',!keep.has(g.dataset.id)));}

  else av=`<circle class="avatar" cx="30" cy="${H/2}" r="21"/><text class="initials" x="30" y="${H/2+5}" text-anchor="middle">${esc(initials(p))}</text>`;
  let s=`<g class="${cls.join(' ')}" data-id="${n.pid}" transform="translate(${n.x},${n.y})" tabindex="0" role="button" aria-label="${esc(nameOf(p)+' '+lifeSpan(p))}">`;

  if(p.deceased)s+=`<text class="cross" x="${W-12}" y="20" text-anchor="middle">†</text>`;
  if(n.more)s+=`<g class="badge" data-goto="${n.pid}" transform="translate(${W/2},${H})"><title>Pokaż potomków (${n.more})</title><rect x="-19" y="-9" width="38" height="18" rx="9"/><text y="4" text-anchor="middle">+${n.more} ▾</text></g>`;

  return s+'</g>';
}
function drawLayout(L){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const n of L.nodes){minX=Math.min(minX,n.x);maxX=Math.max(maxX,n.x+W);minY=Math.min(minY,n.y);maxY=Math.max(maxY,n.y+H);}

  <div class="pn-foot" data-edit>${panelConfirm?`<div class="confirm"><p>Usunąć <b>${esc(nameOf(p))}</b>? Znikną też powiązania z rodzicami, dziećmi i partnerami. Możesz to cofnąć przyciskiem ↶.</p><div class="add-row"><button class="btn small danger solid" data-pdelyes>Usuń osobę</button><button class="btn small" data-pdelno>Anuluj</button></div></div>`:
  `<button class="btn small" data-plink>Połącz z istniejącą osobą…</button><button class="btn small danger" data-pdel>Usuń osobę</button>`}</div>`;
  el.scrollTop=st;
}
function wirePanel(){
  const el=$('#panel');
  el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=S.selectedId,p=P(id);
    if(b.dataset.sel){panelConfirm=false;selectPerson(b.dataset.sel);return;}
    if('pclose' in b.dataset){panelConfirm=false;return closePanel();}
    if('pedit' in b.dataset)return openPersonForm(id);
    if('pfocus' in b.dataset)return setFocus(id);
    if('pkin' in b.dataset){KS.a=id;if(KS.b===id)KS.b=null;location.hash='pokrewienstwo';return;}
    if(b.dataset.addrel)return addRelative(b.dataset.addrel,id);
    if(b.dataset.editunion)return editUnion(b.dataset.editunion);
    if(b.dataset.mkunion){const u={id:uid('u'),a:id,b:b.dataset.mkunion,status:'malzenstwo'};commit([{col:'unions',obj:u}],'zapisanie związku').then(()=>editUnion(u.id));return;}
    if(b.dataset.unlink)return unlink(id,b.dataset.unlink);
    if('plink' in b.dataset)return linkExisting(id);
    if('pdel' in b.dataset){panelConfirm=true;return renderPanel();}
    if('pdelno' in b.dataset){panelConfirm=false;return renderPanel();}
    if('pdelyes' in b.dataset){panelConfirm=false;return deletePerson(id);}
  });
}
function unlink(id,what){const p=clone(P(id));
  if(what==='father'||what==='mother'){const k=what+'Id';const other=P(p[k]);delete p[k];commit([{col:'people',obj:p}],'odłączenie rodzica').then(()=>toast(`Odłączono ${G(other,'ojca','matkę','rodzica')}.`,null,{label:'Cofnij',fn:undo}));return;}
  const [kind,ref]=what.split(':');
  if(kind==='union'){commit([{col:'unions',del:ref}],'usunięcie związku').then(()=>toast('Usunięto związek.',null,{label:'Cofnij',fn:undo}));return;}
  if(kind==='child'){const c=clone(P(ref));if(c.fatherId===id)delete c.fatherId;if(c.motherId===id)delete c.motherId;commit([{col:'people',obj:c}],'odłączenie dziecka').then(()=>toast('Odłączono dziecko.',null,{label:'Cofnij',fn:undo}));}
}
function deletePerson(id){const ch=[{col:'people',del:id}];
  for(const c of kidsOf(id)){const o=clone(c);if(o.fatherId===id)delete o.fatherId;if(o.motherId===id)delete o.motherId;ch.push({col:'people',obj:o});}
  for(const u of C.unions.values())if(u.a===id||u.b===id)ch.push({col:'unions',del:u.id});
  const name=nameOf(P(id));closePanel();if(S.focusId===id)S.focusId=null;
  commit(ch,'usunięcie osoby').then(()=>toast(`Usunięto: ${name}.`,null,{label:'Cofnij',fn:undo}));}

/* ============ modals & forms ============ */
function openModal(title,body,{wide}={}){const root=$('#modal');
  root.innerHTML=`<div class="scrim" data-close></div><div class="dialog${wide?' wide':''}" role="dialog" aria-modal="true" aria-labelledby="dlgT"><header><h2 id="dlgT">${esc(title)}</h2><button class="icon-btn" data-close aria-label="Zamknij">×</button></header><div class="dlg-body">${body}</div></div>`;
  root.hidden=false;root.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));
  setTimeout(()=>{const f=root.querySelector('.dlg-body input:not([type=checkbox]):not([type=file]),.dlg-body select');f&&f.focus();},40);return root;}
function closeModal(){const r=$('#modal');r.hidden=true;r.innerHTML='';}
function picker(el,{value=null,onChange,exclude=[],placeholder='Wpisz imię lub nazwisko…'}={}){
  el.classList.add('picker');el.innerHTML=`<input type="text" id="${el.id}-in" placeholder="${esc(placeholder)}" autocomplete="off"><div class="pick-list" hidden></div>`;
  const inp=el.querySelector('input'),list=el.querySelector('.pick-list');let cur=value,hi=0,res=[];
  const label=id=>{const p=P(id);return p?nameOf(p)+(lifeSpan(p)?' ('+lifeSpan(p)+')':''):'';};
  const set=id=>{cur=id;inp.value=id?label(id):'';onChange&&onChange(id);};
  if(cur)inp.value=label(cur);
  const show=()=>{res=searchPeople(inp.value===label(cur)?'':inp.value).filter(p=>!exclude.includes(p.id)).slice(0,40);hi=0;
    list.innerHTML=res.map((p,i)=>`<button type="button" class="pick-item${i===0?' on':''}" data-id="${p.id}">${esc(nameOf(p))}<span>${esc(lifeSpan(p))}</span></button>`).join('')||'<div class="pick-empty">Brak pasujących osób</div>';list.hidden=false;};
  inp.addEventListener('focus',()=>{inp.select();show();});inp.addEventListener('input',show);
  inp.addEventListener('keydown',e=>{if(list.hidden)return;const items=$$('.pick-item',list);
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hi=(hi+(e.key==='ArrowDown'?1:-1)+items.length)%Math.max(1,items.length);items.forEach((b,i)=>b.classList.toggle('on',i===hi));items[hi]&&items[hi].scrollIntoView({block:'nearest'});}
    else if(e.key==='Enter'){e.preventDefault();if(items[hi]){set(items[hi].dataset.id);list.hidden=true;}}
    else if(e.key==='Escape'){e.stopPropagation();list.hidden=true;}});
  list.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-id]');if(b){e.preventDefault();set(b.dataset.id);list.hidden=true;inp.blur();}});
  inp.addEventListener('blur',()=>setTimeout(()=>{list.hidden=true;inp.value=cur?label(cur):'';},160));
  return {get:()=>cur,set};
}
function dateHint(inp){const h=inp.parentElement.querySelector('.hint');if(!h)return;const v=inp.value.trim();
  if(!v){h.textContent='';h.className='hint';return;}const p=parseDate(v);
  if(p&&!p.invalid){h.textContent='→ '+fmtDate(v);h.className='hint';}else{h.textContent='Nie rozpoznano daty. Użyj np. 14.05.1923, 1923-05 albo ok. 1923.';h.className='hint bad';}}
async function resizePhoto(file){
  const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();
    const s=Math.min(1,240/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',.82);}finally{URL.revokeObjectURL(url);}}

/* rel: {type:'father'|'mother'|'partner'|'child'|'sibling', base:id} */

      if(other&&P(other)&&!unionBetween(other,p.id))extra=`<label class="check"><input type="checkbox" id="f-mkunion" checked> Zapisz związek z: ${esc(nameOf(P(other)))}</label>`;}

  const v=k=>esc(p[k]||'');
  const body=`<form class="form" id="pform" novalidate>${ctx}
  <div class="photo-row"><div id="phPrev">${photoHtml(p)}</div><div style="display:grid;gap:6px"><div class="add-row"><label class="btn small" for="f-photo" style="display:inline-flex;color:var(--ink)">Wybierz zdjęcie</label><input type="file" id="f-photo" accept="image/*" hidden><button type="button" class="btn small ghost" id="phDel"${p.photo?'':' hidden'}>Usuń zdjęcie</button></div><p class="hint">Zdjęcie zostanie zmniejszone do 240 px.</p></div></div>
  <div class="grid2"><label>Imię<input type="text" id="f-first" value="${v('firstName')}" autocomplete="off"></label><label>Drugie imię<input type="text" id="f-middle" value="${v('middleName')}" autocomplete="off"></label>

  <label>Płeć<select id="f-gender"><option value="M"${p.gender==='M'?' selected':''}>Mężczyzna</option><option value="K"${p.gender==='K'?' selected':''}>Kobieta</option><option value="N"${p.gender==='N'?' selected':''}>Nie wiadomo</option></select><span class="hint" id="gHint"></span></label>
  <label>Przydomek / zdrobnienie<input type="text" id="f-nick" value="${v('nickname')}" autocomplete="off"></label></div>
  ${extra}
  <fieldset><legend>Narodziny</legend><div class="grid2"><label>Data<input type="text" id="f-bdate" value="${v('birthDate')}" placeholder="np. 14.05.1923 lub ok. 1923" autocomplete="off"><span class="hint"></span></label><label>Miejsce<input type="text" id="f-bplace" value="${v('birthPlace')}" list="dlPlaces" autocomplete="off"></label></div></fieldset>
  <label class="check"><input type="checkbox" id="f-dead"${p.deceased?' checked':''}> Osoba nie żyje</label>
  <fieldset id="deathFs"${p.deceased?'':' hidden'}><legend>Śmierć</legend><div class="grid2"><label>Data<input type="text" id="f-ddate" value="${v('deathDate')}" placeholder="np. 3.11.1987" autocomplete="off"><span class="hint"></span></label><label>Miejsce<input type="text" id="f-dplace" value="${v('deathPlace')}" list="dlPlaces" autocomplete="off"></label>

  <div class="grid2"><label>Zawód<input type="text" id="f-occ" value="${v('occupation')}" autocomplete="off"></label><label>Miejsce zamieszkania<input type="text" id="f-res" value="${v('residence')}" list="dlPlaces" autocomplete="off"></label></div>
  <fieldset><legend>Inne wydarzenia</legend><div id="evList" style="display:grid;gap:6px">${(p.events||[]).map(ev).join('')}</div><div><button type="button" class="btn small" id="evAdd">+ Dodaj wydarzenie</button></div></fieldset>
  <label>Notatki, wspomnienia, historia<textarea id="f-notes" rows="4">${v('notes')}</textarea></label>

  $('#f-first').addEventListener('input',autoGender);$('#f-last').addEventListener('change',autoGender);
  $('#f-dead').onchange=e=>{$('#deathFs').hidden=!e.target.checked;};

    closeModal();const isFirst=!C.people.size;await commit(ch,label);
    if(isFirst){S.focusId=o.id;savePrefs();setFocus(o.id);}
    selectPerson(rel?rel.base:o.id);

function addRelative(type,baseId){if(S.readonly)return;const b=P(baseId);if(!b)return;
  if(type==='sibling'&&!parentsOf(b).length){toast('Najpierw dodaj rodzica. Rodzeństwo łączy się przez wspólnych rodziców.');return;}

  openPersonForm(null,{type,base:baseId});}
